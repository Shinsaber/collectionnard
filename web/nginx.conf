server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Doit couvrir MAX_UPLOAD_SIZE côté serveur (10 Mo par défaut).
    client_max_body_size 10m;

    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Assets Vite (noms hachés) : cache long
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA : toutes les routes non-fichier renvoient vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Images uploadées (noms UUID immuables) : cache long
    location /api/v1/uploads/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Import du catalogue (admin) : corps jusqu'à MAX_IMPORT_SIZE (20 Mio par défaut).
    location = /api/v1/import {
        client_max_body_size 20m;
        proxy_read_timeout 120s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API vers le serveur Go
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
