server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Doit couvrir MAX_UPLOAD_SIZE côté serveur (10 Mo par défaut).
    client_max_body_size 10m;

    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    # Assets Vite (noms hachés) : cache long
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Application installable (PWA) : le service worker, son script d'enregistrement et le manifeste
    # sont relus à chaque visite, sans quoi une nouvelle version ne serait jamais proposée.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
        try_files $uri =404;
    }

    # SPA : toutes les routes non-fichier renvoient vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Envoi d'une image (POST). Sans ce bloc exact, le préfixe « /api/v1/uploads/ » ci-dessous
    # ferait répondre nginx par une redirection 301 vers « /api/v1/uploads/ » (sur son port interne).
    location = /api/v1/uploads {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images uploadées (noms UUID immuables) : cache long
    location /api/v1/uploads/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Import du catalogue (admin) : corps jusqu'à MAX_IMPORT_SIZE (20 Mio par défaut).
    location = /api/v1/import {
        client_max_body_size 20m;
        proxy_read_timeout 120s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sources externes (admin) : un aperçu enchaîne les appels à Wikidata et à la BnF
    # (le serveur les borne à 2 min).
    location /api/v1/external/ {
        proxy_read_timeout 150s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API vers le serveur Go
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
