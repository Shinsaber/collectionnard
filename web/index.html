<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover : les barres mobiles gèrent elles-mêmes les encoches (env(safe-area-inset-*)). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Couleur de la barre du navigateur mobile : barres claires / sombres de l'identité. -->
    <meta
      name="theme-color"
      content="#f7f8f5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#16212a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Collectionnard</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
