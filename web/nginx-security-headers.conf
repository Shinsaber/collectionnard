# Inclus dans chaque bloc server/location qui pose ses propres add_header
# (nginx n'hérite pas des add_header dès qu'un niveau inférieur en définit un).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# PrimeVue injecte des styles inline (styled mode) : style-src 'unsafe-inline' est nécessaire.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
