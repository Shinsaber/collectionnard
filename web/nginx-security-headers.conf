# Inclus dans chaque bloc server/location qui pose ses propres add_header
# (nginx n'hérite pas des add_header dès qu'un niveau inférieur en définit un).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# camera=(self) : photo de couverture et scanner de codes-barres (mobile.md) ; la caméra exige en outre HTTPS.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Element Plus et les composants web de cropperjs injectent des styles inline : style-src 'unsafe-inline'.
# 'wasm-unsafe-eval' : lecteur de codes-barres zxing-wasm (servi par /assets/, jamais un CDN).
# img-src blob: : aperçu de l'image à recadrer.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
