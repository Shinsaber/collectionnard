# Suivi des épinglages (audit S-007) : actions GitHub par SHA de commit et images Docker par digest.
# Dependabot propose les mises à jour ; Go (go.mod) et npm restent suivis à la main (audits CVE avant
# chaque dernier commit, CLAUDE.md § Règles 4).
# Toutes les mises à jour sont regroupées dans une seule PR mensuelle (groupe « epinglages ») ;
# commit-message ne se règle que sur le groupe.
version: 2
multi-ecosystem-groups:
  epinglages:
    schedule:
      interval: monthly
    commit-message:
      prefix: "Dépendances"
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: epinglages
  - package-ecosystem: docker
    directories: ["/server", "/web"]
    patterns: ["*"]
    multi-ecosystem-group: epinglages
  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: epinglages
    # Une version majeure de PostgreSQL ne lit pas les données existantes (pg_upgrade requis) :
    # cette montée se décide à la main, avec le CI et flake.nix.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
