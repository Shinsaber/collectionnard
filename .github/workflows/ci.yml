name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Backend Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: gofmt
        run: nix develop -c sh -c 'cd server && test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
      - name: go vet
        run: nix develop -c sh -c 'cd server && go vet ./...'
      - name: golangci-lint
        run: nix develop -c sh -c 'cd server && golangci-lint run ./...'
      - name: go test
        run: nix develop -c sh -c 'cd server && go test ./...'
      - name: govulncheck
        run: nix develop -c sh -c 'cd server && govulncheck ./...'

  go-integration:
    name: Backend Go — intégration PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colec
          POSTGRES_PASSWORD: colec
          POSTGRES_DB: colec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U colec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://colec:colec@localhost:5432/colec?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: go test -tags integration (store)
        run: nix develop -c sh -c 'cd server && go test -tags integration ./internal/store/'

  web:
    name: Frontend Vue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: npm ci
        run: nix develop -c sh -c 'cd web && npm ci'
      - name: lint
        run: nix develop -c sh -c 'cd web && npm run lint'
      - name: lint OpenAPI (redocly)
        run: nix develop -c sh -c 'cd web && npm run lint:openapi'
      - name: format
        run: nix develop -c sh -c 'cd web && npm run format:check'
      - name: type-check
        run: nix develop -c sh -c 'cd web && npm run type-check'
      - name: test
        run: nix develop -c sh -c 'cd web && npm test'
      - name: build
        run: nix develop -c sh -c 'cd web && npm run build'
      - name: npm audit
        run: nix develop -c sh -c 'cd web && npm audit --audit-level=high'

  # Images Docker publiées sur GitHub Container Registry, une fois toutes les vérifications passées :
  # à chaque fusion dans main (étiquette `main`) et à chaque tag de version vX.Y.Z (`X.Y.Z`, `X.Y`,
  # `latest`). Jamais sur une pull request. linux/amd64 et linux/arm64 : la compilation se fait sans
  # émulation (Dockerfiles en --platform=$BUILDPLATFORM), QEMU ne sert qu'aux RUN de l'image finale.
  images:
    name: Images Docker (${{ matrix.image }})
    if: github.event_name == 'push'
    needs: [go, go-integration, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: server
            context: .
            dockerfile: server/Dockerfile
          - image: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # Nom d'image en minuscules (ghcr.io refuse « Shinsaber »).
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=collectionnard-${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
