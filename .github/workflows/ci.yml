name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Backend Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: gofmt
        run: nix develop -c sh -c 'cd server && test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
      - name: go vet
        run: nix develop -c sh -c 'cd server && go vet ./...'
      - name: golangci-lint
        run: nix develop -c sh -c 'cd server && golangci-lint run ./...'
      - name: go test
        run: nix develop -c sh -c 'cd server && go test ./...'
      - name: govulncheck
        run: nix develop -c sh -c 'cd server && govulncheck ./...'

  go-integration:
    name: Backend Go — intégration PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: colec
          POSTGRES_PASSWORD: colec
          POSTGRES_DB: colec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U colec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://colec:colec@localhost:5432/colec?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: go test -tags integration (store)
        run: nix develop -c sh -c 'cd server && go test -tags integration ./internal/store/'

  web:
    name: Frontend Vue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: npm ci
        run: nix develop -c sh -c 'cd web && npm ci'
      - name: lint
        run: nix develop -c sh -c 'cd web && npm run lint'
      - name: lint OpenAPI (redocly)
        run: nix develop -c sh -c 'cd web && npm run lint:openapi'
      - name: format
        run: nix develop -c sh -c 'cd web && npm run format:check'
      - name: type-check
        run: nix develop -c sh -c 'cd web && npm run type-check'
      - name: test
        run: nix develop -c sh -c 'cd web && npm test'
      - name: build
        run: nix develop -c sh -c 'cd web && npm run build'
      - name: npm audit
        run: nix develop -c sh -c 'cd web && npm audit --audit-level=high'

  # Images Docker publiées sur GitHub Container Registry, une fois toutes les vérifications passées :
  # à chaque fusion dans main (étiquette `main`) et à chaque tag de version vX.Y.Z (`X.Y.Z`, `X.Y`,
  # `latest`). Jamais sur une pull request. linux/amd64 et linux/arm64 : la compilation se fait sans
  # émulation (Dockerfiles en --platform=$BUILDPLATFORM), QEMU ne sert qu'aux RUN de l'image finale.
  images:
    name: Images Docker (${{ matrix.image }})
    if: github.event_name == 'push'
    needs: [go, go-integration, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: server
            context: .
            dockerfile: server/Dockerfile
          - image: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Nom d'image en minuscules (ghcr.io refuse « Shinsaber »).
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=collectionnard-${{ matrix.image }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
