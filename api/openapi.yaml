openapi: 3.1.0
info:
  title: Collectionnard API
  description: |
    ## API REST pour la gestion de collections générique

    Collectionnard est une plateforme de gestion de collections multi-types (livres, séries TV,
    cartes à collectionner, vinyles, DVD, etc.). Le système est entièrement **dynamique** :
    les types d'items, de relations et de collections sont définis par les administrateurs
    via des **JSON Schemas**, sans modification de code.

    ### Concepts clés

    Le modèle repose sur 3 niveaux d'attributs dynamiques :

    | Méta-type | Rôle | Instances |
    |---|---|---|
    | **ItemType** | Définit le schéma d'un item (ex: "Série", "Épisode") | **Item** |
    | **RelationType** | Définit un lien entre items + contraintes source→target | **ItemRelation** |
    | **CollectionType** | Définit le contexte d'ajout à une collection (ex: "Ownership") | **CollectionItem** |

    Chaque méta-type contient un champ `attributes_schema` qui est un **JSON Schema standard**
    (draft 2020-12). Les instances portent un champ `attributes` (JSONB) validé contre ce schéma
    à chaque création ou modification.

    ### Graphe de relations

    Les items forment un **graphe orienté libre** : un même item (ex: un épisode) peut être
    atteint par plusieurs chemins (via une diffusion TV, un DVD, un streaming…).
    L'endpoint `/items/{id}/graph` permet de traverser ce graphe récursivement.

    ### Authentification

    L'API utilise des **JWT Bearer tokens** de courte durée (défaut 15 min) accompagnés d'un
    **refresh token** à rotation. Obtenez le couple via `POST /auth/login`, envoyez l'access
    token dans le header `Authorization: Bearer <token>`, renouvelez-le avec `POST /auth/refresh`
    et révoquez le refresh token avec `POST /auth/logout`.

    ### Rôles

    - **admin** : crée/modifie les types, items et relations (structuration du catalogue)
    - **user** : consulte le catalogue, gère ses propres collections

    ### Pagination

    Tous les endpoints de listing supportent la pagination via `page` et `per_page`.
    La réponse inclut `total`, `page`, `per_page` et `total_pages`.

    ### Validation

    Les erreurs de validation (422) retournent le détail des champs invalides
    selon le JSON Schema du type concerné.
  version: 0.1.0
  contact:
    name: Collectionnard
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /api/v1
    description: API v1

# =============================================================================
# Tags — Regroupement logique des endpoints
# =============================================================================
tags:
  - name: Auth
    description: |
      Authentification par JWT. Utilisez `POST /auth/login` pour obtenir un token,
      puis passez-le dans le header `Authorization: Bearer <token>` pour tous les
      autres appels.
  - name: Users
    description: |
      Comptes et profils (Phase 4, P4-0) : profil et mot de passe de l'utilisateur courant, invitations à usage
      unique (admin, ou membre si `MEMBER_INVITES`), gestion des comptes et liens de réinitialisation par un admin
      (sans envoi d'e-mail). Voir `docs/phases/social.md`.
  - name: ItemTypes
    description: |
      **Admin uniquement.** Gestion des types d'items. Un ItemType définit le schéma
      d'attributs (JSON Schema) que devront respecter tous les items de ce type.

      Exemples de types : "Série", "Épisode", "DVD", "Livre", "Personne", "Studio".
  - name: RelationTypes
    description: |
      **Admin uniquement.** Gestion des types de relations entre items.
      Un RelationType définit :
      - Les **contraintes source→target** : quels ItemTypes peuvent être liés
        (ex: `broadcast_on` ne peut lier que Series→Broadcast)
      - Un **JSON Schema** pour les attributs portés par le lien
        (ex: disc, track pour un lien DVD→Épisode)

      Ces contraintes permettent au frontend de proposer uniquement les types
      de relation pertinents lors de la création d'un lien.
  - name: CollectionTypes
    description: |
      **Admin uniquement.** Gestion des types de collections. Un CollectionType
      définit la **sémantique** d'une collection et le schéma d'attributs contextuels
      que l'utilisateur renseigne quand il ajoute un item à sa collection.

      Exemples :
      - **Ownership** : état physique, prix d'achat, date d'acquisition
      - **Watching** : date vue, progress en %
      - **Wishlist** : priorité, budget maximum
  - name: ReviewTypes
    description: |
      Types d'avis (I-0). Quatrième méta-type : son JSON Schema liste les **critères notés d'un avis**, chacun un entier
      de 0 à 10. Un type sans critère n'offre que la note globale. Un type d'item sans `review_type_id` n'ouvre pas
      les avis (les personnes, pour éviter les attaques contre des gens).
  - name: Reviews
    description: |
      Avis (I-0) : un par utilisateur et par item, sur l'œuvre et non sur un exemplaire. Note globale **ou** note par
      critère (tous obligatoires, la note est alors leur moyenne), texte facultatif.

      Une note compte toujours dans la moyenne de la fiche, affichée à partir de 5 notes. La visibilité décide de ce que
      voit le lecteur :

      | `visibility` | Membres connectés | Visiteurs anonymes |
      | --- | --- | --- |
      | `private` | Note seule | Note seule |
      | `friends` | Avis signé pour les amis, note seule sinon | Note seule |
      | `members` | Avis signé | Note seule |
      | `anonymous` | Texte sans auteur | Texte sans auteur |
      | `public` | Avis signé | Avis signé |

      Une note seule n'apparaît pas dans les listes, seulement dans `note_only_count`. Le filtre vaut aussi pour les
      admins.
  - name: Moderation
    description: |
      Signalements, modération et réactions (I-1). Un membre signale un avis qu'il voit ; les admins et le rôle
      `moderator` masquent, rétablissent ou classent sans suite. Toute action va au journal (ajout seul, copie du
      contenu). Un avis masqué sort des listes et des moyennes, son auteur le voit encore avec le motif. Les
      réactions donnent une intention ou une émotion, jamais un signalement. Écritures limitées par heure et par
      compte (avis 60, signalements 20, réactions 300 ; admins exemptés) : 429 `rate_limited` avec `Retry-After`.
  - name: Articles
    description: |
      Articles sur la fiche d'un item (I-3) : relayer une nouvelle (titre, lien http(s), un mot), sur tous les types
      d'item. L'article d'un membre attend la validation d'un modérateur, comme une proposition de fiche ; les admins et
      les modérateurs publient directement. Le serveur ne récupère jamais le lien (pas d'aperçu). Un article publié se
      signale, se masque et porte un fil de commentaires.
  - name: Recommendations
    description: |
      Recommandations et blocages (I-4). Un membre recommande un item à un membre de l'annuaire (profil `members` ou
      `public`), avec un mot facultatif : le destinataire est notifié et retrouve ses recommandations reçues. Il peut
      les refuser toutes (`accepts_recommendations` du profil) ou bloquer l'expéditeur : les deux répondent le même 403,
      l'expéditeur ne sait pas lequel. 20 recommandations par jour et par compte (admins exemptés).

      Bloquer un membre : il ne peut plus recommander d'item au bloqueur, ni commenter ou réagir à ses contenus signés
      (403 `blocked`) ; ses avis signés et ses articles sortent des listes du bloqueur, ses commentaires y deviennent des
      traces (`blocked`), ses messages ne le notifient plus. Sur un contenu qui ne nomme pas son auteur (avis anonyme), le
      blocage ne refuse rien et l'avis reste listé : refuser ou retirer le nommerait. Les notes des membres bloqués comptent toujours dans les
      moyennes.
  - name: Loans
    description: |
      Prêts (P7-3). Le propriétaire d'un lot d'une collection dont le type est marqué `x-lendable` (Possession) prête
      des exemplaires à un **ami** (notifié `loan_started`, sans acceptation) ou à un **simple nom**. Les exemplaires
      prêtés ne dépassent jamais la quantité du lot : un lot ne descend pas sous ses exemplaires prêtés, une scission
      les laisse sur le lot d'origine, une fusion déplace ses prêts. Le prêt n'est vu que du propriétaire (liste de sa
      collection, `GET /me/loans`) et de l'ami emprunteur (`GET /me/borrowings`, sans la note ni le nom de la
      collection) : jamais des autres lecteurs. Un prêt rendu (`returned_at`) reste comme historique. Une fois l'échéance
      passée, le propriétaire et l'ami sont notifiés (`loan_overdue`), une seule fois par échéance.
  - name: Gifts
    description: |
      Cadeaux réservés (P7-4). Sur une liste de souhaits (type marqué `x-reservable`), un **ami** du propriétaire
      réserve une part d'un lot pour l'offrir ; les autres amis voient qui a réservé et combien, pour se coordonner
      (`reservations` des lots de `GET /public/collections/{id}/items`, `can_reserve` de la collection). Le propriétaire
      n'en sait **jamais** rien : ni ses routes, ni ses listes, exports, statistiques ou copie hors ligne ne lisent les
      réservations ; une réservation sur sa propre liste répond 404 ; une lecture anonyme ou par lien de partage ne les
      montre pas. Annuler supprime la réservation. Quand le lot quitte la liste, la réservation reste (`left_list`) et
      l'offrant est notifié (`gift_left_list`) ; il la marque offerte (`given`) ou l'annule. Une réservation non offerte vaut
      jusqu'à `expires_at` (60 jours par défaut, un an au plus) : passée cette date, elle ne compte plus et sort de la vue des
      amis, son offrant la garde (`expired`) pour la prolonger ou l'annuler ; il est prévenu 7 jours avant (`gift_expiring`).
  - name: Friends
    description: |
      Amis (P7-2). Une amitié est réciproque : un membre en invite un autre dont il voit le profil, par son nom
      d'utilisateur (tout autre nom répond 404, comme un nom inconnu : les noms ne se devinent pas), et l'autre
      accepte ou refuse. Inviter un membre qui m'a déjà invité vaut acceptation. Pour un profil privé, un **lien
      d'ami** secret (usage unique, 7 jours, 10 valides au plus, seul son hash est stocké) se transmet hors de
      l'application : qui l'ouvre et l'accepte devient ami de son auteur.
      L'amitié ouvre le niveau de visibilité `friends` des collections, des profils et des avis.
      Refuser, annuler ou rompre supprime l'amitié, sans notification. Bloquer un membre rompt l'amitié et retire les
      demandes entre eux ; la demande d'un membre bloqué reste sans réponse (en attente, jamais montrée ni notifiée).
      20 demandes par jour et par compte (admins exemptés). Notifications `friend_request` et `friend_accepted`
      (`payload` : `friendship_id`, `by`).

  - name: Items
    description: |
      Gestion du catalogue d'items. Chaque item est un **nœud unique** dans le graphe :
      un épisode, un DVD, une personne, etc. Il n'existe qu'une seule fiche par item,
      partagée entre tous les utilisateurs.

      Les données spécifiques à un utilisateur (état, prix, note…) sont portées par
      le lien **CollectionItem**, pas par l'item lui-même.

      **Écriture** : admin uniquement (MVP). **Lecture** : tous les utilisateurs authentifiés.
  - name: Relations
    description: |
      **Admin ou contributeur.** Gestion des relations entre items (les arêtes du graphe).
      Chaque relation relie un item source à un item target via un RelationType.

      Le système valide automatiquement que :
      1. Les ItemTypes de source et target correspondent aux contraintes du RelationType
      2. Les attributs du lien respectent le JSON Schema du RelationType

      Un doublon (même type + même source + même target) est rejeté (409).
  - name: Graph
    description: |
      Traversée bidirectionnelle du graphe d'items. L'endpoint `/items/{id}/graph` effectue une
      traversée récursive (CTE) depuis un item racine dans les **deux directions** :
      - **Descendante** (source → target) : explore les enfants, profondeur positive
      - **Ascendante** (target → source) : explore les parents, profondeur négative

      Le paramètre `max_depth` s'applique dans chaque direction.

      Le format de réponse (nœuds + arêtes) est directement exploitable par des
      librairies de visualisation (D3.js, Cytoscape.js, vis.js…).

      La détection de cycles est gérée côté serveur pour éviter les boucles infinies.
  - name: Collections
    description: |
      Gestion des collections personnelles de l'utilisateur. Chaque collection :
      - Appartient à **un seul utilisateur**
      - A un **CollectionType** qui définit sa sémantique (possession, visionnage…)
      - Contient des items avec des **attributs contextuels** (état, prix, note…)

      Un utilisateur ne peut pas avoir deux collections avec le même nom.
      Un item ne peut apparaître qu'une fois dans une collection donnée.
      Supprimer une collection ne supprime **pas** les items du catalogue.
  - name: Tags
    description: |
      Étiquettes libres associées aux items pour faciliter la recherche et le filtrage.
      Les tags sont créés automatiquement lors de la création d'un item si le nom
      n'existe pas encore. Ils sont partagés globalement (pas par utilisateur).
  - name: Public
    description: |
      Lectures sans compte ou par d'autres membres (P4-2) : profils, collections visibles, liens de partage.
      Les champs cachés d'une collection (`x-private` du type ou `hidden_fields` du propriétaire) sont retirés
      par le serveur pour tout autre lecteur que le propriétaire, admins compris.
  - name: Proposals
    description: |
      Propositions des membres (P4-3b) : ajouts et corrections du catalogue au format de l'import, suggestions de
      champ, signalements ; modération par les admins et contributeurs, discussion.
  - name: Stats
    description: |
      Statistiques globales sur le catalogue et les collections :
      nombre d'items par type, total des collections, etc.
  - name: Uploads
    description: |
      Upload et récupération de fichiers images. Les images sont stockées localement
      sur le serveur. L'upload est réservé aux admins ; la lecture (`GET /uploads/{filename}`)
      est publique car les balises `<img>` ne peuvent pas envoyer d'en-tête Authorization.
  - name: ImportExport
    description: |
      Export du catalogue (JSON, admin) et réimportation idempotente (les UUID sont conservés :
      réimporter un export met à jour, ne duplique pas, ne supprime jamais) ; exports CSV des
      items d'un type et d'une collection, pour un tableur. Les comptes et les collections des
      utilisateurs ne font pas partie de l'export du catalogue.
  - name: External
    description: |
      Recherche et aperçu : tout compte connecté ; import direct : admins et contributeurs ; un membre propose
      la sélection (`/propose`, P4-3b). Récupération depuis des sources ouvertes, un connecteur par sorte de
      collection (`/external/{connector}/…`, liste : `GET /external/connectors`) : `bd-manga` (manga, BD) et
      `novels` (romans : roman, cycle et auteurs sur Wikidata ; éditions BnF de sa notice d'œuvre, traducteurs,
      illustrateurs et préfaciers) et `music` (CD, vinyles : album, éditions, pistes, artistes et labels sur
      **MusicBrainz**, données de base CC0 ; ni genres ni tags, sous licence non commerciale ; une requête par
      seconde ; types du paquet `music`, rapprochés par MBID, labels aussi par nom) et `films` (film, générique et cinq premiers
      interprètes sur **Wikidata**, éditions vidéo DVD / Blu-ray / VHS du dépôt légal à la **BnF** par sa notice d'œuvre ou par
      EAN ; une édition seule retrouve son film ; types des paquets `video` et `people`) et `series` (série, diffusion, saisons et
      épisodes sur **Wikidata**, complétés par **TVmaze** — CC BY-SA, sans clé — pour les saisons sans épisodes ; coffrets à la
      **BnF** par titre ou EAN, reliés aux épisodes des saisons qu'ils contiennent ; types des paquets `tv`, `video`, `people`).
      Connecteur `games` : jeu, sociétés et plateformes (rattachées à leur constructeur) sur **Wikidata**, éditions
      françaises du dépôt légal à la **BnF** par titre ou EAN, une édition seule retrouve son jeu ; types des paquets `games` et
      `people`.
      Connecteur `bd-manga` :
      œuvres, univers et auteurs sur **Wikidata** (CC0), éditions françaises et tomes sur la **BnF**
      (Licence Ouverte : source et date de récupération écrites dans `sources`). Parcours :
      recherche (`works`, `editions`) → aperçu (`preview`) → simulation puis import (`import`,
      même rapport que `POST /import`).

      Le connecteur écrit dans les types du domaine BD / Manga, trouvés par nom technique (`Manga`,
      `Comic`, `Universe`, `Edition`, `Volume`, `Person`, `Publisher` ; relations `contains_work`,
      `created_by`, `published_as`, `edited_by`, `contains_volume`) : s'il en manque, 409
      `connector_unavailable`. Les items déjà présents (même QID Wikidata, ARK BnF, ISBN, ou nom
      d'éditeur sans casse ni accents) gardent leurs valeurs : la source ne remplit que les champs
      vides. Source injoignable : 502 `external_unavailable`.
  - name: Domains
    description: |
      **Admin uniquement.** Paquets de domaine (types d'une sorte de collection : séries TV, livres…)
      embarqués dans le serveur, à installer ou mettre à jour sur l'instance. La mise à jour fusionne :
      les modifications faites sur l'instance sont gardées. Un paquet peut en requérir d'autres (`requires` : `books` →
      `people`, qui porte `Person` et `Publisher`), installés avec lui. Aussi en ligne de commande :
      `colec-server install-domain`.
  - name: Health
    description: |
      État de santé de l'API (connexion à la base). Public, utilisé par le healthcheck
      docker-compose et la supervision.

# =============================================================================
# Sécurité
# =============================================================================
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtenu via `POST /auth/login`.
        Durée de validité : configurable côté serveur.
        À envoyer dans le header : `Authorization: Bearer <token>`

  # ===========================================================================
  # Schémas réutilisables
  # ===========================================================================
  schemas:
    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------
    LoginRequest:
      type: object
      description: Identifiants de connexion.
      required: [username, password]
      properties:
        username:
          type: string
          description: Nom d'utilisateur unique, insensible à la casse (« Admin » = « admin »).
          example: shinsaber
        password:
          type: string
          format: password
          description: Mot de passe en clair (transmis via HTTPS).

    LoginResponse:
      type: object
      description: |
        Réponse d'authentification : un access token JWT de courte durée, un refresh token
        opaque pour le renouveler, et le profil utilisateur. Renvoyée par `POST /auth/login`
        et `POST /auth/refresh`.
      required: [token, refresh_token, expires_in, user]
      properties:
        token:
          type: string
          description: |
            Access token JWT (HS256, claims `sub`, `role`, `iss`, `iat`, `exp`) à envoyer dans le
            header `Authorization: Bearer <token>`. Durée de vie `ACCESS_TOKEN_TTL` (défaut 15 min).
          example: eyJhbGciOiJIUzI1NiIs...
        refresh_token:
          type: string
          description: |
            Token opaque (256 bits, base64url) permettant d'obtenir un nouveau couple de tokens via
            `POST /auth/refresh`. **Usage unique** : chaque refresh invalide le token présenté et en
            renvoie un nouveau (rotation). Durée de vie `REFRESH_TOKEN_TTL` (défaut 30 jours).
            Révocable via `POST /auth/logout`.
          example: 3q2-7wAAAQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHw
        expires_in:
          type: integer
          description: Durée de validité de `token` en secondes.
          example: 900
        user:
          $ref: "#/components/schemas/User"

    RefreshRequest:
      type: object
      description: Corps de `POST /auth/refresh` et `POST /auth/logout`.
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token reçu lors du login ou du dernier refresh.

    # -------------------------------------------------------------------------
    # User
    # -------------------------------------------------------------------------
    User:
      type: object
      description: Profil utilisateur. Le rôle détermine les droits d'accès (admin ou user).
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant unique de l'utilisateur.
        username:
          type: string
          description: Nom d'utilisateur unique, utilisé pour la connexion.
          example: shinsaber
        email:
          type: string
          format: email
          description: Adresse email unique.
          example: shinsaber@colec.local
        role:
          type: string
          enum: [admin, contributor, moderator, user]
          description: |
            Rôle de l'utilisateur :
            - `admin` : peut créer/modifier types, items, relations
            - `contributor` : écrit directement dans le catalogue (sans supprimer d'item) et modère les propositions
            - `user` : peut gérer ses collections et consulter le catalogue
        display_name:
          type: string
          maxLength: 100
          description: Nom affiché (repli sur `username`).
        bio: { type: string, maxLength: 2000, description: Présentation libre. }
        avatar:
          type: string
          description: "URL d'une image envoyée (`url` de `POST /uploads`, `/api/v1/uploads/…`)."
        disabled_at:
          type: string
          format: date-time
          description: Compte désactivé depuis cette date (connexion et rafraîchissement refusés).
        profile_visibility:
          $ref: "#/components/schemas/Visibility"
        accepts_recommendations:
          type: boolean
          description: Les autres membres peuvent lui recommander des items (I-4).
        can_invite:
          type: boolean
          description: |
            `GET /auth/me` seulement — l'utilisateur peut créer des invitations (admin, ou membre si
            `MEMBER_INVITES` est activé).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserUpdate:
      type: object
      description: Modification d'un compte par un admin (champs absents inchangés).
      properties:
        role: { type: string, enum: [admin, contributor, moderator, user] }
        disabled:
          type: boolean
          description: |
            `true` désactive le compte (ses jetons de rafraîchissement sont révoqués ; un jeton d'accès déjà émis
            reste valable jusqu'à son expiration, `ACCESS_TOKEN_TTL`), `false` le réactive.

    ProfileUpdate:
      type: object
      description: Profil de l'utilisateur courant (remplacement complet ; chaîne vide = champ effacé).
      properties:
        display_name: { type: string, maxLength: 100 }
        bio: { type: string, maxLength: 2000 }
        avatar:
          type: string
          pattern: "^/api/v1/uploads/[^/]+$"
          description: URL d'une image envoyée (`url` de `POST /uploads`) ; gardée par la purge des images.
        profile_visibility:
          allOf:
            - $ref: "#/components/schemas/Visibility"
          description: Qui voit le profil et la liste des collections visibles ; absent ou vide = `private`.
        accepts_recommendations:
          type: boolean
          description: Les autres membres peuvent me recommander des items ; absent = `true`.

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    Invitation:
      type: object
      description: Invitation à créer un compte. Le jeton n'est jamais renvoyé après sa création.
      required: [id, role, expires_at, status, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [admin, contributor, moderator, user] }
        note: { type: string, maxLength: 255, description: "Mémo de l'auteur (« pour Camille »)." }
        created_by: { type: string, format: uuid }
        created_by_username: { type: string }
        expires_at: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, used, expired]
        used_at: { type: string, format: date-time }
        used_by_username: { type: string }
        created_at: { type: string, format: date-time }

    InvitationCreate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, contributor, moderator, user]
          default: user
          description: Rôle du compte créé ; `admin` réservé aux admins.
        note: { type: string, maxLength: 255 }
        expires_in_days: { type: integer, minimum: 1, maximum: 90, default: 7 }

    InvitationCreated:
      type: object
      description: Invitation créée et son jeton, montré cette seule fois (lien `/register?token=…`).
      required: [invitation, token]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        token: { type: string }

    InvitationCheck:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        expires_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [token, username, email, password]
      properties:
        token: { type: string, description: Jeton de l'invitation. }
        username: { type: string, minLength: 2, maxLength: 100, pattern: "^[A-Za-z0-9_.-]+$" }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    ResetLink:
      type: object
      description: Lien de réinitialisation du mot de passe, montré cette seule fois (`/reset-password?token=…`).
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }

    # -------------------------------------------------------------------------
    # ItemType
    # -------------------------------------------------------------------------
    ItemType:
      type: object
      description: |
        Type d'item. Définit le schéma d'attributs (JSON Schema) que devront
        respecter tous les items de ce type. Exemples : "Série", "Épisode", "DVD".
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 'Nom unique du type (ex: "Series", "Episode", "DVD").'
          example: Series
        description:
          type: string
          description: Description libre du type, affichée dans l'UI.
          example: Série télévisée
        display_order:
          type: integer
          description: |
            Ordre d'affichage (petit = en premier, puis par nom) : listes, sélecteurs, « Répartition
            par type ». Défaut 100.
          example: 10
        review_type_id:
          type: [string, "null"]
          format: uuid
          description: Type d'avis (critères notés) ; `null` = avis fermés sur ce type.
        attributes_schema:
          type: object
          description: |
            **JSON Schema (draft 2020-12)** définissant les attributs des items de ce type.
            Utilisé pour :
            - Valider les données à la création/modification d'un item
            - Générer dynamiquement les formulaires côté frontend
            - Documenter les champs attendus

            Le schéma doit avoir `"type": "object"` à la racine.
          example:
            type: object
            required: [title]
            properties:
              title: { type: string, minLength: 1 }
              synopsis: { type: string }
              start_year: { type: integer, minimum: 1900 }
              end_year: { type: integer, minimum: 1900 }
              poster: { type: string, format: uri }
            additionalProperties: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ItemTypeCreate:
      type: object
      description: Données pour créer un nouveau type d'item.
      required: [name, attributes_schema]
      properties:
        name:
          type: string
          description: Nom unique du type. Ne peut pas être modifié après création s'il existe des items.
        description:
          type: string
          description: Description libre.
        display_order:
          type: integer
          description: Ordre d'affichage (défaut 100).
        review_type_id:
          type: [string, "null"]
          format: uuid
          description: Type d'avis ; absent ou `null` = avis fermés sur ce type.
        attributes_schema:
          type: object
          description: 'JSON Schema définissant les attributs. Doit être un JSON Schema valide avec `"type": "object"` à la racine.'

    ItemTypeUpdate:
      type: object
      description: |
        Données pour modifier un type d'item. Seuls les champs fournis sont mis à jour.
        **Attention** : modifier `attributes_schema` peut rendre des items existants invalides.
        Le serveur ne revalide pas automatiquement les items existants.
      properties:
        name:
          type: string
        description:
          type: string
        display_order:
          type: integer
        review_type_id:
          type: [string, "null"]
          format: uuid
          description: Absent = inchangé ; `null` ferme les avis sur ce type.
        attributes_schema:
          type: object

    # -------------------------------------------------------------------------
    # RelationType
    # -------------------------------------------------------------------------
    RelationType:
      type: object
      description: |
        Type de relation entre items. Définit les contraintes de liaison (quels types source
        peuvent être liés à quels types cible) et le schéma d'attributs portés par le lien.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nom unique du type de relation.
          example: broadcast_on
        description:
          type: string
          description: Description de la sémantique de cette relation.
          example: Série diffusée via un mode de diffusion (TV, streaming…)
        source_item_type_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs des ItemTypes autorisés en source.
        target_item_type_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs des ItemTypes autorisés en cible.
        source_item_types:
          type: array
          items:
            $ref: "#/components/schemas/ItemType"
          description: ItemTypes source (inclus dans les réponses GET).
        target_item_types:
          type: array
          items:
            $ref: "#/components/schemas/ItemType"
          description: ItemTypes cible (inclus dans les réponses GET).
        attributes_schema:
          type: object
          description: |
            JSON Schema pour les attributs portés par la relation.
            Exemple : pour un lien DVD→Épisode, on peut avoir `{disc: integer, track: integer}`.
            Un schéma vide `{}` signifie que la relation ne porte pas de données additionnelles.
          example:
            type: object
            properties:
              disc: { type: integer, minimum: 1 }
              track: { type: integer, minimum: 1 }
            additionalProperties: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RelationTypeCreate:
      type: object
      description: |
        Données pour créer un nouveau type de relation.
        Les champs `source_item_type_ids` et `target_item_type_ids` définissent les contraintes
        de types : seuls les items des types spécifiés pourront être liés par cette relation.
      required: [name, source_item_type_ids, target_item_type_ids]
      properties:
        name:
          type: string
          description: 'Nom unique (ex: "broadcast_on", "contains_episode", "written_by").'
        description:
          type: string
          description: Description de la sémantique de cette relation.
        source_item_type_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs des ItemTypes source. Doivent exister.
        target_item_type_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs des ItemTypes cible. Doivent exister.
        attributes_schema:
          type: object
          description: JSON Schema pour les attributs du lien. Défaut `{}` (pas d'attributs).
          default: {}

    RelationTypeUpdate:
      type: object
      description: Modification partielle d'un type de relation. Seuls les champs fournis sont mis à jour.
      properties:
        name:
          type: string
        description:
          type: string
        source_item_type_ids:
          type: array
          items:
            type: string
            format: uuid
        target_item_type_ids:
          type: array
          items:
            type: string
            format: uuid
        attributes_schema:
          type: object

    # -------------------------------------------------------------------------
    # CollectionType
    # -------------------------------------------------------------------------
    CollectionType:
      type: object
      description: |
        Type de collection. Définit la sémantique d'une collection et le schéma d'attributs
        que l'utilisateur remplit quand il ajoute un item à sa collection.

        Exemples :
        - **Ownership** : état_physique, purchase_price, acquisition_date
        - **Watching** : watched_at, progress (%)
        - **Wishlist** : priority (1-5), max_budget
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nom unique du type de collection.
          example: Ownership
        description:
          type: string
          description: Description de la sémantique de ce type de collection.
          example: Items possédés physiquement par l'utilisateur
        item_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Types d'item permis dans les collections de ce type ; vide = tous. Contrôlé à l'ajout
            (`POST /collections/{id}/items`, import de collection) : les items déjà présents et
            devenus non permis sont conservés.
          example: []
        attributes_schema:
          type: object
          description: |
            JSON Schema pour les attributs contextuels du lien collection↔item.
            Ce schéma définit les données que l'utilisateur remplit pour chaque item
            ajouté à une collection de ce type.
          example:
            type: object
            properties:
              condition:
                {
                  type: string,
                  enum: [neuf, très bon, bon, acceptable, mauvais],
                }
              purchase_price: { type: number, minimum: 0 }
              acquisition_date: { type: string, format: date }
            additionalProperties: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollectionTypeCreate:
      type: object
      description: Données pour créer un nouveau type de collection.
      required: [name]
      properties:
        name:
          type: string
          description: 'Nom unique (ex: "Ownership", "Watching", "Wishlist").'
        description:
          type: string
        attributes_schema:
          type: object
          description: JSON Schema pour les attributs du lien collection↔item. Défaut `{}`.
          default: {}
        item_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: Types d'item permis (absent ou vide = tous).

    CollectionTypeUpdate:
      type: object
      description: Modification partielle d'un type de collection.
      properties:
        name:
          type: string
        description:
          type: string
        attributes_schema:
          type: object
        item_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: Remplace la liste des types d'item permis ; absent = inchangée, `[]` = tous.

    # -------------------------------------------------------------------------
    # Item
    # -------------------------------------------------------------------------
    ReviewType:
      type: object
      description: Type d'avis. Son schéma liste les critères notés, chacun un entier de 0 à 10.
      required: [id, name, attributes_schema, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nom technique unique.
          example: ComicReview
        description:
          type: string
        attributes_schema:
          type: object
          description: |
            JSON Schema : `"type": "object"` à la racine, chaque propriété `{"type": "integer", "minimum": 0, "maximum": 10}`.
            Sans propriété : note globale seulement.
          example:
            type: object
            x-order: [story, art]
            x-labels:
              fr: { story: Scénario, art: Dessin }
              en: { story: Story, art: Art }
            properties:
              story: { type: integer, minimum: 0, maximum: 10 }
              art: { type: integer, minimum: 0, maximum: 10 }
            additionalProperties: false
        context_relation_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Relations qui mènent de l'item noté à l'édition qu'un avis peut préciser (Game → GameRelease par
            `game_released_as`). Vide : pas d'édition à choisir.
        context_label:
          type: object
          additionalProperties: { type: string, maxLength: 60 }
          description: Libellé de ce choix par langue de l'interface.
          example: { fr: Joué sur, en: Played on }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReviewTypeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        attributes_schema:
          type: object
        context_relation_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Relations qui mènent de l'item noté à l'édition qu'un avis peut préciser (Game → GameRelease par
            `game_released_as`). Vide : pas d'édition à choisir.
        context_label:
          type: object
          additionalProperties: { type: string, maxLength: 60 }
          description: Libellé de ce choix par langue de l'interface.
          example: { fr: Joué sur, en: Played on }

    ReviewTypeUpdate:
      type: object
      description: Un champ absent est gardé ; un tableau ou un objet vide l'efface.
      properties:
        name:
          type: string
        description:
          type: string
        attributes_schema:
          type: object
        context_relation_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Relations qui mènent de l'item noté à l'édition qu'un avis peut préciser (Game → GameRelease par
            `game_released_as`). Vide : pas d'édition à choisir.
        context_label:
          type: object
          additionalProperties: { type: string, maxLength: 60 }
          description: Libellé de ce choix par langue de l'interface.
          example: { fr: Joué sur, en: Played on }

    ReviewVisibility:
      type: string
      enum: [private, friends, members, anonymous, public]
      description: Ce que voit le lecteur, voir l'étiquette `Reviews`.

    ReviewAuthor:
      type: object
      required: [username]
      properties:
        username:
          type: string
        display_name:
          type: string
        avatar:
          type: string

    Review:
      type: object
      required: [id, item_id, rating, body, spoiler, lang, visibility, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        review_type_id:
          type: string
          format: uuid
          description: Type dont viennent les critères ; absent en note globale.
        criteria:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 10 }
          description: Note de chaque critère ; absent en note globale.
        context_item_id:
          type: string
          format: uuid
          description: Édition utilisée pour donner l'avis ; absente, avec `author`, d'un avis non signé pour le lecteur.
        context_item:
          allOf:
            - $ref: "#/components/schemas/Item"
          description: Cette édition, avec son type (libellé).
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: Note saisie, ou moyenne des critères à une décimale.
        body:
          type: string
          description: Texte en Markdown restreint, rendu sans HTML ni image par le client.
        spoiler:
          type: boolean
        lang:
          type: string
          enum: [fr, en]
        visibility:
          $ref: "#/components/schemas/ReviewVisibility"
        hidden_at:
          type: string
          format: date-time
          description: Masqué par la modération ; un avis masqué n'atteint que son auteur et les modérateurs.
        hidden_reason:
          type: string
        reactions:
          type: object
          additionalProperties: { type: integer }
          description: Nombre de chaque réaction (`interesting`, `tempting`, `funny`, `disapprove`).
        my_reactions:
          type: array
          items: { type: string, enum: [interesting, tempting, funny, disapprove] }
        comment_count:
          type: integer
          description: Commentaires visibles du fil (I-2).
        comments_closed:
          type: boolean
          description: Fil fermé par l'auteur de l'avis.
        author:
          allOf:
            - $ref: "#/components/schemas/ReviewAuthor"
          description: Présent seulement si l'avis est signé pour le lecteur.
        item:
          allOf:
            - $ref: "#/components/schemas/Item"
          description: Listes par utilisateur seulement (`/me/reviews`, `/public/users/{username}/reviews`).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReviewPut:
      type: object
      description: Une note globale (`rating`) ou la note de chaque critère (`criteria`), jamais les deux.
      required: [lang, visibility]
      properties:
        rating:
          type: integer
          minimum: 0
          maximum: 10
        criteria:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 10 }
          description: Tous les critères du type d'avis sont obligatoires.
        context_item_id:
          type: string
          format: uuid
          description: Facultatif. Une cible de l'item par une relation `context_relation_type_ids` de son type d'avis (422 sinon).
        body:
          type: string
          maxLength: 10000
        spoiler:
          type: boolean
        lang:
          type: string
          enum: [fr, en]
        visibility:
          $ref: "#/components/schemas/ReviewVisibility"

    ReviewCriterionSummary:
      type: object
      required: [key, count, rating]
      properties:
        key:
          type: string
        count:
          type: integer
        rating:
          type: [number, "null"]
          description: "`null` sous `min_ratings` avis détaillés."

    ReviewSummary:
      type: object
      required: [enabled, count, rating, min_ratings, note_only_count, criteria, context_items]
      properties:
        enabled:
          type: boolean
          description: "`false` : avis fermés sur le type de cet item."
        review_type:
          $ref: "#/components/schemas/ReviewType"
        count:
          type: integer
          description: Nombre de notes, quelle que soit leur visibilité.
        rating:
          type: [number, "null"]
          description: Moyenne à une décimale ; `null` sous `min_ratings` notes, pour qu'une note ne se lise pas dans la moyenne.
        min_ratings:
          type: integer
          example: 5
        note_only_count:
          type: integer
          description: Notes que le lecteur ne voit pas dans la liste (la sienne exclue).
        criteria:
          type: array
          description: Moyenne par critère, dans l'ordre du schéma, sur les seuls avis détaillés.
          items:
            $ref: "#/components/schemas/ReviewCriterionSummary"
        context_items:
          type: array
          description: Éditions qu'un avis sur cet item peut préciser (100 au plus).
          items:
            $ref: "#/components/schemas/Item"

    Article:
      type: object
      required: [id, item_id, mine, title, url, message, lang, status, comment_count, comments_closed, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        author:
          $ref: "#/components/schemas/ReviewAuthor"
        mine: { type: boolean }
        title: { type: string, maxLength: 200 }
        url: { type: string, format: uri, maxLength: 2000, description: "Adresse http(s), jamais récupérée par le serveur." }
        message: { type: string, maxLength: 1000 }
        lang: { type: string, enum: [fr, en] }
        status:
          type: string
          enum: [pending, published, rejected]
          description: "L'article d'un membre attend la validation d'un modérateur ; les admins et modérateurs publient directement."
        reject_reason: { type: string, description: Motif d'un refus (son auteur seulement). }
        hidden_at: { type: string, format: date-time }
        hidden_reason: { type: string }
        comment_count: { type: integer }
        comments_closed: { type: boolean }
        item:
          $ref: "#/components/schemas/Item"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ArticleWrite:
      type: object
      required: [title, url, lang]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, maxLength: 2000 }
        message: { type: string, maxLength: 1000 }
        lang: { type: string, enum: [fr, en] }

    Comment:
      type: object
      required: [id, target_kind, target_id, target_author, mine, body, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        target_kind: { type: string, enum: [review, article] }
        target_id: { type: string, format: uuid }
        author:
          allOf:
            - $ref: "#/components/schemas/ReviewAuthor"
          description: Absent pour l'auteur d'un avis anonyme qui répond dans son fil (`target_author`).
        target_author:
          type: boolean
          description: Écrit par l'auteur de l'avis ou de l'article commenté.
        mine:
          type: boolean
          description: Écrit par le lecteur (modifier, supprimer).
        body:
          type: string
          description: Markdown restreint, comme un avis.
        hidden_at:
          type: string
          format: date-time
          description: "Masqué par la modération : son auteur le voit avec le motif, les autres une trace sans texte ni auteur."
        deleted_at:
          type: string
          format: date-time
          description: Supprimé par son auteur ; trace sans texte ni auteur, qui garde le sens des réponses.
        edited_at:
          type: string
          format: date-time
          description: Modifié après sa publication.
        blocked:
          type: boolean
          description: Écrit par un membre que le lecteur a bloqué ; trace sans texte ni auteur.
        hidden_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Recommendation:
      type: object
      description: Un item recommandé au lecteur ; seul le destinataire la lit, l'expéditeur lui est nommé.
      required: [id, item_id, message, created_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        item:
          $ref: "#/components/schemas/Item"
        sender:
          $ref: "#/components/schemas/ReviewAuthor"
        message:
          type: string
          maxLength: 500
          description: Texte brut (pas de Markdown), éventuellement vide.
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }

    RecommendationCreate:
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: Nom d'utilisateur du destinataire.
        message:
          type: string
          maxLength: 500

    Block:
      type: object
      description: |
        Un membre bloqué. `user` est absent quand le bloqueur ne doit pas savoir qui il est : bloqué depuis un contenu
        qui ne le nommait pas (avis anonyme, commentaire « Un membre »), ou profil qui ne lui est plus visible.
      required: [id, created_at]
      properties:
        id: { type: string, format: uuid }
        user:
          $ref: "#/components/schemas/ReviewAuthor"
        created_at: { type: string, format: date-time }

    BlockCreate:
      type: object
      description: Un nom d'utilisateur, ou un contenu montré au lecteur dont l'auteur est bloqué (l'un ou l'autre).
      properties:
        username: { type: string }
        content_kind:
          type: string
          enum: [review, comment, article, recommendation]
        content_id: { type: string, format: uuid }

    Friendship:
      type: object
      description: |
        Une amitié ou une demande, vue par l'un des deux membres : `user` est l'autre. Une demande envoyée à un membre
        dont le profil ne m'est pas visible ne montre que le nom d'utilisateur saisi.
      required: [id, status, incoming, user, profile_visible, created_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, accepted]
        incoming:
          type: boolean
          description: "Demande reçue (`false` : demande envoyée, ou amitié)."
        user:
          $ref: "#/components/schemas/ReviewAuthor"
        profile_visible:
          type: boolean
          description: Le profil public de l'autre membre m'est ouvert (`/public/users/{username}`).
        created_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }

    FriendLink:
      type: object
      description: Lien d'ami secret, à usage unique. `token` n'est présent qu'à la création, `user` qu'à l'ouverture.
      required: [id, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        user:
          $ref: "#/components/schemas/ReviewAuthor"
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    FriendRequestCreate:
      type: object
      required: [username]
      properties:
        username: { type: string, description: "Nom d'utilisateur exact du membre invité." }

    CommentBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000

    ReportCreate:
      type: object
      required: [target_kind, target_id, reason]
      properties:
        target_kind:
          type: string
          enum: [review, comment, article]
        target_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [abusive, harassment, spoiler, spam, off_topic, other]
        details:
          type: string
          maxLength: 1000

    Report:
      type: object
      required: [id, target_kind, target_id, reason, details, status, reporter_id, reporter_dismissed, created_at]
      properties:
        id: { type: string, format: uuid }
        target_kind: { type: string }
        target_id: { type: string, format: uuid }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, actioned, dismissed] }
        reporter_id: { type: string, format: uuid }
        reporter:
          $ref: "#/components/schemas/ReviewAuthor"
        reporter_dismissed:
          type: integer
          description: Signalements du même membre classés sans suite ces 90 derniers jours.
        created_at: { type: string, format: date-time }

    ModerationRecap:
      type: object
      required: [hidden_90d, hidden_total, dismissed_reports_90d]
      properties:
        hidden_90d: { type: integer }
        hidden_total: { type: integer }
        dismissed_reports_90d: { type: integer }

    ModerationItem:
      type: object
      required: [target_kind, target_id, author_id, reports, author_recap]
      properties:
        target_kind: { type: string }
        target_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        review:
          allOf:
            - $ref: "#/components/schemas/Review"
          description: Avis entier, auteur compris même s'il est anonyme (modérateurs seulement) ; pour un commentaire, l'avis de son fil ; absent s'il a été supprimé.
        comment:
          $ref: "#/components/schemas/Comment"
        article:
          $ref: "#/components/schemas/Article"
        review_type:
          $ref: "#/components/schemas/ReviewType"
        item:
          $ref: "#/components/schemas/Item"
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        author_recap:
          $ref: "#/components/schemas/ModerationRecap"

    ModerationLogEntry:
      type: object
      required: [id, action, target_kind, target_id, reason, excerpt, still_hidden, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [hide, restore, dismiss] }
        target_kind: { type: string }
        target_id: { type: string, format: uuid }
        target_author:
          $ref: "#/components/schemas/ReviewAuthor"
        author_id: { type: string, format: uuid }
        moderator:
          $ref: "#/components/schemas/ReviewAuthor"
        reason: { type: string }
        excerpt: { type: string, description: Copie du contenu au moment de l'action. }
        still_hidden: { type: boolean }
        created_at: { type: string, format: date-time }

    ModerationHistory:
      type: object
      required: [user, recap, entries, dismissed_reports]
      properties:
        user:
          $ref: "#/components/schemas/ReviewAuthor"
        recap:
          $ref: "#/components/schemas/ModerationRecap"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ModerationLogEntry"
        dismissed_reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"

    Item:
      type: object
      description: |
        Un item est un **nœud unique** dans le graphe. Il représente n'importe quel objet
        du catalogue : une série, un épisode, un DVD, un auteur, un studio, etc.

        L'item porte ses attributs métier dans le champ `attributes` (JSONB), dont la
        structure est définie et validée par le `attributes_schema` de son ItemType.

        Un item est partagé entre tous les utilisateurs. Les données spécifiques à un
        utilisateur (état, prix, note…) sont dans le lien CollectionItem.
      properties:
        id:
          type: string
          format: uuid
        item_type_id:
          type: string
          format: uuid
          description: ID du ItemType de cet item.
        item_type:
          $ref: "#/components/schemas/ItemType"
          description: ItemType complet (inclus dans les réponses GET).
        attributes:
          type: object
          description: |
            Attributs métier de l'item au format JSONB. La structure dépend du ItemType.
            Exemple pour une Série : `{"title": "Breaking Bad", "start_year": 2008, "end_year": 2013}`
          example:
            title: Breaking Bad
            synopsis: Un professeur de chimie se tourne vers la fabrication de méthamphétamine.
            start_year: 2008
            end_year: 2013
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: Tags associés à cet item.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ItemCreate:
      type: object
      description: |
        Données pour créer un nouvel item. Le champ `attributes` sera validé contre
        le `attributes_schema` du ItemType référencé. En cas de non-conformité, une
        erreur 422 est retournée avec le détail des champs invalides.
      required: [item_type_id, attributes]
      properties:
        item_type_id:
          type: string
          format: uuid
          description: ID du ItemType. Détermine le schéma de validation des attributs.
        attributes:
          type: object
          description: Attributs métier de l'item, conformes au JSON Schema du ItemType.
        tags:
          type: array
          items:
            type: string
          description: |
            Noms de tags à associer. Les tags sont créés automatiquement s'ils n'existent
            pas encore. Insensible à la casse (les tags sont normalisés en minuscules).
          example: [drame, thriller, crime]

    ItemUpdate:
      type: object
      description: |
        Modification d'un item (sémantique PUT : **remplacement**). `attributes`, s'il est
        fourni, remplace intégralement l'objet existant et est validé contre le JSON Schema
        du ItemType ; envoyer l'objet complet (le front le fait toujours). Omis, les attributs
        sont inchangés.
      properties:
        attributes:
          type: object
          description: Nouvel objet d'attributs complet, validé contre le JSON Schema.
        tags:
          type: array
          items:
            type: string
          description: "Nouvelle liste de tags : omis = inchangés, `[]` = supprime tous les tags."

    # -------------------------------------------------------------------------
    # ItemRelation
    # -------------------------------------------------------------------------
    ItemRelation:
      type: object
      description: |
        Relation entre deux items (arête orientée du graphe). Porte les attributs
        définis par le RelationType (ex: numéro de disc/track pour un lien DVD→Épisode).
      properties:
        id:
          type: string
          format: uuid
        relation_type_id:
          type: string
          format: uuid
          description: ID du RelationType de cette relation.
        relation_type:
          $ref: "#/components/schemas/RelationType"
          description: |
            RelationType complet : inclus par `GET /relations/{id}` et les écritures, **absent** de
            `GET /items/{id}/relations` (le client le retrouve par `relation_type_id`).
        source_item_id:
          type: string
          format: uuid
          description: ID de l'item source (origine de la relation).
        source_item:
          $ref: "#/components/schemas/Item"
          description: |
            Item source avec ses attributs (inclus dans les réponses GET) ; sans `item_type` dans
            `GET /items/{id}/relations`.
        target_item_id:
          type: string
          format: uuid
          description: ID de l'item cible (destination de la relation).
        target_item:
          $ref: "#/components/schemas/Item"
          description: |
            Item cible avec ses attributs (inclus dans les réponses GET) ; sans `item_type` dans
            `GET /items/{id}/relations`.
        attributes:
          type: object
          description: |
            Attributs du lien, validés contre le `attributes_schema` du RelationType.
            Peut être vide `{}` si le RelationType n'a pas d'attributs.
          example:
            disc: 1
            track: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Dernière modification des attributs (migration 002).

    ItemRelationCreate:
      type: object
      description: |
        Données pour créer une relation entre deux items.

        **Validations effectuées :**
        1. `source_item_id` et `target_item_id` doivent exister
        2. Le ItemType de la source doit correspondre à l'un des `source_item_type_ids` du RelationType
        3. Le ItemType de la cible doit correspondre à l'un des `target_item_type_ids` du RelationType
        4. Les `attributes` doivent respecter le JSON Schema du RelationType
        5. Le triplet (relation_type, source, target) doit être unique (pas de doublons)
        6. Un item ne peut pas être relié à lui-même
      required: [relation_type_id, source_item_id, target_item_id]
      properties:
        relation_type_id:
          type: string
          format: uuid
          description: ID du RelationType. Détermine les contraintes et le schéma de validation.
        source_item_id:
          type: string
          format: uuid
          description: ID de l'item source.
        target_item_id:
          type: string
          format: uuid
          description: ID de l'item cible. Doit être différent de `source_item_id`.
        attributes:
          type: object
          description: Attributs du lien, conformes au JSON Schema du RelationType. Défaut `{}`.
          default: {}

    ItemRelationUpdate:
      type: object
      description: |
        Modification des attributs d'une relation existante. On ne peut pas changer
        les items source/target ni le type — il faut supprimer et recréer la relation.
      required: [attributes]
      properties:
        attributes:
          type: object
          description: Nouveaux attributs, revalidés contre le JSON Schema du RelationType.

    # -------------------------------------------------------------------------
    # Collection
    # -------------------------------------------------------------------------
    Collection:
      type: object
      description: |
        Collection personnelle d'un utilisateur. Conteneur explicite qui associe
        l'utilisateur à des items du catalogue, avec des attributs contextuels
        (état, prix, note…) définis par le CollectionType.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: ID du propriétaire de la collection.
        collection_type_id:
          type: string
          format: uuid
          description: ID du CollectionType (Ownership, Watching, Wishlist…).
        collection_type:
          $ref: "#/components/schemas/CollectionType"
          description: CollectionType complet (inclus dans les réponses GET).
        name:
          type: string
          description: Nom de la collection, unique par utilisateur.
          example: Mes DVDs
        description:
          type: string
          description: Description libre de la collection.
          example: Ma collection de DVDs et Blu-rays
        item_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Types d'item que la collection accepte (P7-1b), parmi ceux de son CollectionType (sinon 422
            `item_type_not_allowed`) ; vide = tous ceux du type. Une collection qui n'en accepte qu'un est
            **spécialisée** : elle se trie et se filtre par les attributs de ce type sans `item_type_id`. Seuls les
            nouveaux ajouts sont contrôlés.
        default_sort:
          type: string
          description: |
            Tri des lots quand la liste est lue sans `sort` (P7-1b), pages publiques et liens de partage compris :
            `created_at`, `updated_at`, `quantity`, ou `attr.<clé>` pour une collection spécialisée ; préfixe `-` pour
            descendant ; vide = ajout le plus récent. Sinon 422 `invalid_sort`. Un tri devenu sans objet (attribut
            retiré, types acceptés changés) est ignoré à la lecture.
          example: attr.number
        item_count:
          type: integer
          description: Nombre d'items différents de la collection (calculé automatiquement ; un item formant plusieurs lots compte une fois).
          example: 42
        copy_count:
          type: integer
          description: Nombre d'exemplaires (somme des quantités des lots, P7-1).
          example: 45
        visibility:
          $ref: "#/components/schemas/Visibility"
        hidden_fields:
          type: [array, "null"]
          items: { type: string }
          description: |
            Champs du CollectionType cachés aux autres lecteurs. `null` : les propriétés `x-private` du schéma ;
            sinon la liste complète, qui remplace ce défaut (`[]` montre tout).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollectionCreate:
      type: object
      description: Données pour créer une nouvelle collection.
      required: [collection_type_id, name]
      properties:
        collection_type_id:
          type: string
          format: uuid
          description: ID du CollectionType. Détermine la sémantique et le schéma des attributs d'ajout.
        name:
          type: string
          description: Nom de la collection, unique pour cet utilisateur.
        description:
          type: string
          description: Description libre.
        item_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Types d'item que la collection accepte (P7-1b), parmi ceux de son CollectionType (sinon 422
            `item_type_not_allowed`) ; vide = tous ceux du type. Une collection qui n'en accepte qu'un est
            **spécialisée** : elle se trie et se filtre par les attributs de ce type sans `item_type_id`. Seuls les
            nouveaux ajouts sont contrôlés.
        default_sort:
          type: string
          description: |
            Tri des lots quand la liste est lue sans `sort` (P7-1b), pages publiques et liens de partage compris :
            `created_at`, `updated_at`, `quantity`, ou `attr.<clé>` pour une collection spécialisée ; préfixe `-` pour
            descendant ; vide = ajout le plus récent. Sinon 422 `invalid_sort`. Un tri devenu sans objet (attribut
            retiré, types acceptés changés) est ignoré à la lecture.
          example: attr.number

    CollectionUpdate:
      type: object
      description: |
        Modification d'une collection. Le type ne peut pas être changé après création.
      properties:
        name:
          type: string
          description: Nouveau nom (doit rester unique pour cet utilisateur).
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        hidden_fields:
          type: [array, "null"]
          items: { type: string }
          description: |
            Absent : inchangé. `null` : retour au défaut du type (`x-private`). Liste : champs cachés (clés du
            schéma du CollectionType, sinon 422).
        item_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Types d'item que la collection accepte (P7-1b), parmi ceux de son CollectionType (sinon 422
            `item_type_not_allowed`) ; vide = tous ceux du type ; absent = inchangé. Une collection qui n'en accepte qu'un est
            **spécialisée** : elle se trie et se filtre par les attributs de ce type sans `item_type_id`. Seuls les
            nouveaux ajouts sont contrôlés.
        default_sort:
          type: string
          description: |
            Tri des lots quand la liste est lue sans `sort` (P7-1b), pages publiques et liens de partage compris :
            `created_at`, `updated_at`, `quantity`, ou `attr.<clé>` pour une collection spécialisée ; préfixe `-` pour
            descendant ; vide = ajout le plus récent. Sinon 422 `invalid_sort`. Un tri devenu sans objet (attribut
            retiré, types acceptés changés) est ignoré à la lecture.
          example: attr.number

    # -------------------------------------------------------------------------
    # CollectionItem
    # -------------------------------------------------------------------------
    GiftReservation:
      type: object
      description: |
        Réservation de cadeau (P7-4). `giver` : l'offrant, nommé aux autres amis du propriétaire ; `note` : la sienne,
        à lui seul. Dans `/me/gifts` : `owner` (pour qui) et `item` ; `left_list` quand le lot a quitté la liste.
      required: [id, item_id, quantity, status, expires_at, expired, mine, left_list, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        lot_id: { type: string, format: uuid }
        left_list: { type: boolean }
        item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        status: { type: string, enum: [reserved, given] }
        expires_at:
          type: string
          format: date
          description: Dernier jour où une réservation non offerte tient.
        expired:
          type: boolean
          description: Non offerte et échue ; ne compte plus, vue de son offrant seul.
        mine: { type: boolean, description: Réservée par le lecteur. }
        giver:
          $ref: "#/components/schemas/ReviewAuthor"
        note: { type: string }
        owner:
          $ref: "#/components/schemas/ReviewAuthor"
        item:
          $ref: "#/components/schemas/Item"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReservationCreate:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        expires_at:
          type: string
          format: date
          description: "D'aujourd'hui à un an ; absent : dans 60 jours."
        note: { type: string, maxLength: 500 }

    ReservationUpdate:
      type: object
      required: [quantity, status]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        status: { type: string, enum: [reserved, given] }
        expires_at:
          type: string
          format: date
          description: "Absent : inchangée (même passée) ; changée : d'aujourd'hui à un an."
        note: { type: string, maxLength: 500 }

    Loan:
      type: object
      description: |
        Prêt d'exemplaires d'un lot (P7-3). Dates au format `AAAA-MM-JJ`. `borrower` : l'ami emprunteur (absent pour un
        simple nom, ou un compte disparu) ; `borrower_name` est toujours présent, figé au moment du prêt. `owner` n'est
        donné qu'à l'emprunteur, `note` et `collection_name` qu'au propriétaire ; `item` dans `/me/loans` et
        `/me/borrowings`.
      required: [id, lot_id, collection_id, quantity, borrower_name, lent_at, overdue, note, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        lot_id: { type: string, format: uuid }
        collection_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        borrower:
          $ref: "#/components/schemas/ReviewAuthor"
        borrower_name: { type: string }
        lent_at: { type: string, format: date }
        due_at: { type: string, format: date }
        returned_at: { type: string, format: date }
        overdue:
          type: boolean
          description: En cours et son échéance est passée.
        note: { type: string }
        owner:
          $ref: "#/components/schemas/ReviewAuthor"
        item:
          $ref: "#/components/schemas/Item"
        collection_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LoanCreate:
      type: object
      description: Un ami par son nom d'utilisateur (`borrower_username`) **ou** un simple nom (`borrower_name`).
      properties:
        quantity: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        borrower_username: { type: string }
        borrower_name: { type: string, maxLength: 100 }
        lent_at: { type: string, format: date, description: "Absent : aujourd'hui." }
        due_at: { type: string, format: date }
        note: { type: string, maxLength: 500 }

    LoanUpdate:
      type: object
      description: "Champs modifiables d'un prêt, remplacés (l'emprunteur ne change pas). `returned_at` le clôt."
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        lent_at: { type: string, format: date, description: "Absent : inchangé." }
        due_at: { type: string, format: date }
        returned_at: { type: string, format: date }
        note: { type: string, maxLength: 500 }

    CollectionItem:
      type: object
      description: |
        **Lot** d'une collection (P7-1) : un ou plusieurs exemplaires identiques d'un item (`quantity`).
        Porte les **attributs contextuels** définis par le CollectionType (état physique, prix d'achat
        unitaire, date vue…), qui valent pour chacun de ses exemplaires. Un même item peut former plusieurs
        lots dans une collection (un état ou une finition différents).

        C'est ici que se trouvent les données spécifiques à l'utilisateur pour un item donné.
        L'item lui-même reste partagé et immuable pour tous les utilisateurs.
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant du lot (adresse des routes `/collections/{collectionId}/lots/{lotId}`).
        collection_id:
          type: string
          format: uuid
          description: ID de la collection.
        item_id:
          type: string
          format: uuid
          description: ID de l'item.
        item:
          $ref: "#/components/schemas/Item"
          description: Item complet (inclus dans les réponses GET).
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          description: Nombre d'exemplaires du lot.
          example: 1
        attributes:
          type: object
          description: |
            Attributs contextuels de l'item dans cette collection, validés contre
            le `attributes_schema` du CollectionType de la collection parente.

            Exemple pour un CollectionType "Ownership" :
            `{"condition": "neuf", "purchase_price": 45.00, "acquisition_date": "2020-12-25"}`
          example:
            condition: new
            purchase_price: 45.00
            acquisition_date: "2020-12-25"
        loans:
          type: array
          description: Prêts en cours du lot (P7-3), dans la liste de son propriétaire seulement.
          items:
            $ref: "#/components/schemas/Loan"
        reservations:
          type: array
          description: |
            Réservations de cadeau du lot (P7-4), pour un ami du propriétaire lisant sa liste de souhaits, jamais pour le
            propriétaire.
          items:
            $ref: "#/components/schemas/GiftReservation"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollectionItemAdd:
      type: object
      description: |
        Données pour ajouter un item à une collection. Les attributs sont validés
        contre le JSON Schema du CollectionType de la collection.

        Crée toujours un **nouveau lot**, même si l'item est déjà dans la collection : pour ajouter des
        exemplaires à un lot existant, modifier sa `quantity` (`PUT /collections/{collectionId}/lots/{lotId}`).
        Si le CollectionType limite les types d'item (`item_type_ids`), un item d'un autre type
        est refusé (422 `item_type_not_allowed`).
      required: [item_id]
      properties:
        item_id:
          type: string
          format: uuid
          description: ID de l'item à ajouter. Doit exister dans le catalogue.
        attributes:
          type: object
          description: |
            Attributs contextuels de l'item dans cette collection.
            Validés contre le JSON Schema du CollectionType.
          default: {}
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
          description: Nombre d'exemplaires du lot.

    CollectionItemUpdate:
      type: object
      description: |
        Modification d'un lot : ses attributs contextuels (remplacés, revalidés contre le JSON Schema du
        CollectionType) et, si elle est donnée, sa quantité (absente : inchangée).
      required: [attributes]
      properties:
        attributes:
          type: object
          description: Nouveaux attributs contextuels.
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          description: Nouvelle quantité ; absente, la quantité du lot ne change pas.

    CollectionLotSplit:
      type: object
      description: |
        Scission d'un lot (P7-1) : `quantity` exemplaires en sortent pour former un nouveau lot du même item,
        avec `attributes` (absents : copie de ceux du lot d'origine). Il doit rester au moins un exemplaire.
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Exemplaires détachés, moins que la quantité du lot.
        attributes:
          type: object
          additionalProperties: true
          description: Attributs du nouveau lot, validés contre le JSON Schema du CollectionType.

    CollectionLotMerge:
      type: object
      description: |
        Fusion de deux lots du même item dans la même collection (P7-1) : le lot `into` reçoit les
        exemplaires et garde ses attributs ; les photos des galeries du lot fusionné le rejoignent, puis il est supprimé.
      required: [into]
      properties:
        into:
          type: string
          format: uuid
          description: Lot qui reçoit les exemplaires.

    # -------------------------------------------------------------------------
    # Tag
    # -------------------------------------------------------------------------
    Tag:
      type: object
      description: Étiquette libre partagée globalement. Utilisée pour catégoriser et filtrer les items.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nom du tag, unique et normalisé en minuscules.
          example: drame

    # -------------------------------------------------------------------------
    # ItemCollectionMembership
    # -------------------------------------------------------------------------
    ItemCollectionMembership:
      type: object
      description: |
        Lot d'un item dans une collection de l'utilisateur (une entrée par lot : un item peut former
        plusieurs lots d'une même collection). Contient la collection complète, l'identifiant et la
        quantité du lot, et ses attributs contextuels (état, prix, note…).
      properties:
        lot_id:
          type: string
          format: uuid
          description: Identifiant du lot.
        quantity:
          type: integer
          description: Nombre d'exemplaires du lot.
        collection:
          $ref: "#/components/schemas/Collection"
          description: Collection contenant l'item.
        attributes:
          type: object
          description: |
            Attributs contextuels de l'item dans cette collection, définis par
            le `attributes_schema` du CollectionType de la collection.
          example:
            condition: new
            purchase_price: 45.00
            acquisition_date: "2020-12-25"

    # -------------------------------------------------------------------------
    # Graph
    # -------------------------------------------------------------------------
    GraphNode:
      type: object
      description: Nœud du graphe, représentant un item avec ses métadonnées de traversée.
      properties:
        id:
          type: string
          format: uuid
          description: ID de l'item.
        type:
          type: string
          description: Nom du ItemType de cet item.
          example: Series
        label:
          type: string
          description: |
            Label lisible de l'item, dérivé automatiquement des attributs
            calculé côté serveur avec le gabarit `x-label` de l'ItemType (repli : `title`, `name`, `label`…).
          example: Breaking Bad
        attributes:
          type: object
          description: Attributs complets de l'item.
        depth:
          type: integer
          description: |
            Profondeur dans le graphe depuis le nœud racine.
            - `0` : nœud racine
            - Valeurs positives (1, 2, 3…) : nœuds descendants (source → target)
            - Valeurs négatives (-1, -2, -3…) : nœuds ascendants (target → source)
          example: 0

    GraphEdge:
      type: object
      description: Arête du sous-graphe (une ItemRelation projetée).
      required: [source_id, target_id, relation_type, attributes]
      properties:
        source_id:
          type: string
          format: uuid
          description: ID de l'item source.
        target_id:
          type: string
          format: uuid
          description: ID de l'item cible.
        relation_type:
          type: string
          description: Nom du RelationType.
          example: includes_episode
        attributes:
          type: object
          description: Attributs de la relation.

    GraphResponse:
      type: object
      description: |
        Résultat d'une traversée de graphe. Contient tous les nœuds et arêtes
        accessibles depuis l'item racine, jusqu'à la profondeur demandée.

        L'exploration est bornée par `GRAPH_MAX_NODES` nœuds (défaut 500) : au-delà,
        `truncated` vaut `true` et le sous-graphe est partiel.

        Format directement exploitable par les librairies de visualisation de graphe :
        - **D3.js** : `nodes` → nœuds, `edges` → links
        - **Cytoscape.js** : conversion directe en éléments
        - **vis.js** : mapping trivial nœuds/arêtes
      properties:
        root:
          $ref: "#/components/schemas/GraphNode"
          description: Nœud racine de la traversée.
        truncated:
          type: boolean
          description: "`true` si la limite de nœuds du serveur a interrompu l'exploration."
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
          description: Tous les nœuds du sous-graphe (sans le root, qui est séparé).
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
          description: Arêtes entre les nœuds du sous-graphe (racine incluse).

    # -------------------------------------------------------------------------
    # Pagination
    # -------------------------------------------------------------------------
    PaginatedResponse:
      type: object
      description: |
        Enveloppe de réponse paginée. Tous les endpoints de listing (GET sur une collection)
        retournent ce format. Le client peut naviguer avec `page` et `per_page`.
      properties:
        data:
          type: array
          items: {}
          description: Liste des éléments de la page courante.
        total:
          type: integer
          description: Nombre total d'éléments toutes pages confondues.
          example: 42
        page:
          type: integer
          description: Numéro de la page courante (1-indexed).
          example: 1
        per_page:
          type: integer
          description: Nombre d'éléments par page.
          example: 20
        total_pages:
          type: integer
          description: Nombre total de pages.
          example: 3

    # -------------------------------------------------------------------------
    # Erreur
    # -------------------------------------------------------------------------
    ItemsByType:
      type: object
      description: Nombre d'items pour un ItemType.
      required: [type_id, type_name, count]
      properties:
        type_id:
          type: string
          format: uuid
          description: Identifiant du ItemType (lien vers le catalogue filtré).
        type_name:
          type: string
          description: Nom du ItemType.
          example: Episode
        count:
          type: integer
          description: Nombre d'items de ce type.
          example: 42

    Stats:
      type: object
      description: Statistiques globales du catalogue et des collections.
      required: [items_by_type, total_items, total_collections, total_relations]
      properties:
        items_by_type:
          type: array
          description: Comptage d'items ventilé par ItemType, dans l'ordre d'affichage des types (`display_order`, puis nom).
          items:
            $ref: "#/components/schemas/ItemsByType"
        total_items:
          type: integer
          description: Nombre total d'items dans le catalogue.
          example: 156
        total_collections:
          type: integer
          description: Nombre total de collections (tous utilisateurs).
          example: 12
        total_relations:
          type: integer
          description: Nombre total de relations (arêtes du graphe).
          example: 340

    NumberStat:
      type: object
      description: Agrégats d'un attribut numérique (`number` ou `integer`) du CollectionType.
      required: [field, count, sum, avg, min, max]
      properties:
        field:
          type: string
          description: Clé de l'attribut dans le schéma du CollectionType.
          example: purchase_price
        count:
          type: integer
          description: Nombre d'exemplaires qui portent une valeur numérique.
        sum: { type: number }
        avg: { type: number }
        min: { type: number }
        max: { type: number }

    ValueCount:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
          description: |
            Valeur brute (valeur d'enum, ou `true` / `false` pour un booléen) ; le client la traduit
            via `x-enum-labels`.
          example: very_good
        count:
          type: integer

    Distribution:
      type: object
      description: |
        Répartition d'un attribut enum ou booléen du CollectionType. Les valeurs suivent l'ordre de `enum`
        (celles à zéro comprises), puis les valeurs hors enum par nombre décroissant.
      required: [field, values, missing]
      properties:
        field:
          type: string
          example: condition
        values:
          type: array
          items:
            $ref: "#/components/schemas/ValueCount"
        missing:
          type: integer
          description: Exemplaires sans valeur pour cet attribut.

    MonthCount:
      type: object
      required: [month, count]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          example: 2026-10
        count:
          type: integer

    Timeline:
      type: object
      description: Nombre d'exemplaires par mois pour un attribut date (`format` date ou date-time), mois croissants.
      required: [field, months]
      properties:
        field:
          type: string
          example: acquisition_date
        months:
          type: array
          items:
            $ref: "#/components/schemas/MonthCount"

    StatsItem:
      type: object
      description: Item réduit à ce qu'il faut pour afficher son libellé (`x-label` de son ItemType, calculé par le client).
      required: [id, item_type_id, attributes]
      properties:
        id: { type: string, format: uuid }
        item_type_id: { type: string, format: uuid }
        attributes:
          type: object
          additionalProperties: true

    Completeness:
      type: object
      description: |
        Complétude d'un item « contenant » : parmi ses enfants par les relations marquées `x-completeness`
        (tomes d'une édition, épisodes d'une saison, pistes d'un disque…), combien sont dans la collection.
      required: [item, owned, total]
      properties:
        item:
          $ref: "#/components/schemas/StatsItem"
        owned:
          type: integer
          example: 30
        total:
          type: integer
          example: 42

    CollectionStats:
      type: object
      description: |
        Statistiques d'une collection, déduites du schéma de son CollectionType (aucune clé codée en dur).
      required: [collection_id, total_items, items_by_type, numbers, distributions, timelines, added, completeness, completeness_truncated, item_types]
      properties:
        collection_id: { type: string, format: uuid }
        total_items:
          type: integer
          description: Nombre d'exemplaires de la collection.
        items_by_type:
          type: array
          description: Exemplaires par ItemType (nombre décroissant).
          items:
            $ref: "#/components/schemas/ItemsByType"
        numbers:
          type: array
          description: Un élément par attribut numérique du schéma (ordre `x-order`).
          items:
            $ref: "#/components/schemas/NumberStat"
        distributions:
          type: array
          description: Un élément par attribut enum ou booléen du schéma.
          items:
            $ref: "#/components/schemas/Distribution"
        timelines:
          type: array
          description: Un élément par attribut date du schéma.
          items:
            $ref: "#/components/schemas/Timeline"
        added:
          type: array
          description: Ajouts à la collection par mois (date d'ajout).
          items:
            $ref: "#/components/schemas/MonthCount"
        completeness:
          type: array
          description: |
            Contenants dont au moins un enfant est dans la collection : les incomplets d’abord, les plus
            proches de la complétude en tête, puis les complets (au plus 200).
          items:
            $ref: "#/components/schemas/Completeness"
        completeness_truncated:
          type: boolean
          description: Vrai si la liste `completeness` a été coupée à 200 éléments.
        item_types:
          type: array
          description: |
            ItemTypes cités par `items_by_type` et `completeness` (libellés calculés par le client, y compris pour un
            lecteur anonyme qui ne peut pas lire `/item-types`).
          items:
            $ref: "#/components/schemas/ItemType"

    CollectionSummary:
      type: object
      required: [id, name, collection_type_id, item_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        collection_type_id: { type: string, format: uuid }
        item_count: { type: integer }

    MeStats:
      type: object
      description: Statistiques de toutes les collections de l'utilisateur connecté.
      required: [total_collections, total_entries, distinct_items, items_by_type, collections, added]
      properties:
        total_collections: { type: integer }
        total_entries:
          type: integer
          description: Exemplaires, toutes collections confondues (un item dans deux collections compte deux fois).
        distinct_items:
          type: integer
          description: Items différents, toutes collections confondues.
        items_by_type:
          type: array
          description: Items différents par ItemType (nombre décroissant).
          items:
            $ref: "#/components/schemas/ItemsByType"
        collections:
          type: array
          description: Mes collections, la plus grande en premier.
          items:
            $ref: "#/components/schemas/CollectionSummary"
        added:
          type: array
          description: Ajouts par mois, toutes collections confondues.
          items:
            $ref: "#/components/schemas/MonthCount"

    Visibility:
      type: string
      enum: [private, friends, members, public]
      description: |
        `private` : le propriétaire seul ; `friends` : ses amis (P7-2) ; `members` : tout compte connecté ;
        `public` : tout le monde, connecté ou non.

    Owner:
      type: object
      description: Propriétaire d'une collection publique, tel que les autres le voient.
      required: [username]
      properties:
        username: { type: string }
        display_name: { type: string }
        avatar: { type: string }

    PublicCollection:
      type: object
      description: |
        Collection lue par un autre que son propriétaire (page publique, lien de partage). Le schéma du
        CollectionType a perdu ses champs cachés (propriétés, `x-order`, `required`, `x-labels`).
      required: [id, name, collection_type, item_count, owner, visibility, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        collection_type:
          $ref: "#/components/schemas/CollectionType"
        item_count: { type: integer }
        owner:
          $ref: "#/components/schemas/Owner"
        visibility:
          $ref: "#/components/schemas/Visibility"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        can_reserve:
          type: boolean
          description: Le lecteur, ami du propriétaire, peut réserver des cadeaux sur cette liste de souhaits (P7-4).

    PublicProfile:
      type: object
      description: Profil d'un membre tel que les autres le voient (ni e-mail ni rôle).
      required: [username, profile_visibility, created_at]
      properties:
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        avatar: { type: string }
        profile_visibility:
          $ref: "#/components/schemas/Visibility"
        created_at: { type: string, format: date-time }

    ShareLink:
      type: object
      description: Lien de partage secret d'une collection (lecture seule). Le jeton n'est jamais renvoyé après sa création.
      required: [id, collection_id, created_at]
      properties:
        id: { type: string, format: uuid }
        collection_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ShareLinkCreated:
      type: object
      required: [share_link, token]
      properties:
        share_link:
          $ref: "#/components/schemas/ShareLink"
        token:
          type: string
          description: Jeton à transmettre (montré une seule fois) ; le client construit le lien `…/share?token=…`.

    HistoryAuthor:
      type: object
      description: |
        Auteur d'une écriture du catalogue. `kind` : `user` (profil visible du lecteur, `user` renseigné),
        `member` (profil non visible du lecteur, ou compte désactivé : « un membre »), `system` (seed, SQL).
        Calculé à chaque lecture selon la visibilité **actuelle** du profil ; les admins voient toujours l'auteur.
      required: [kind]
      properties:
        kind: { type: string, enum: [user, member, system] }
        user:
          $ref: "#/components/schemas/Owner"

    HistoryEntry:
      type: object
      description: Une écriture d'un item ou d'une relation qui le touche (instantanés des attributs).
      required: [kind, entity_id, version, origin, author, created_at]
      properties:
        kind: { type: string, enum: [item, relation] }
        entity_id: { type: string, format: uuid }
        version:
          type: integer
          description: Version de l'entité (1 = création).
        origin:
          type: string
          enum: [direct, import, external, proposal, revert, system]
        origin_ref:
          type: string
          description: Connecteur (`external`), proposition (`proposal`), version restaurée (`revert`).
        author:
          $ref: "#/components/schemas/HistoryAuthor"
        before:
          type: [object, "null"]
          additionalProperties: true
          description: Attributs avant (`null` à la création).
        after:
          type: [object, "null"]
          additionalProperties: true
          description: Attributs après (`null` à la suppression).
        relation:
          type: object
          description: Relation concernée (`kind` = `relation`).
          properties:
            relation_type_id: { type: string, format: uuid }
            source_item_id: { type: string, format: uuid }
            target_item_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ItemHistory:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          description: Écritures de l'item et de ses relations, la plus récente en premier (500 au plus).
          items:
            $ref: "#/components/schemas/HistoryEntry"
        truncated: { type: boolean }
        created:
          $ref: "#/components/schemas/HistoryEntry"
          description: Création de l'item (version 1), même hors de `entries` ; absente pour un item antérieur à l'historique.

    RevertRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Version de l'item dont les attributs sont restaurés.

    Proposal:
      type: object
      description: |
        Proposition d'un membre (P4-3b). `catalog` : items et relations au format de l'import du catalogue ;
        `schema_suggestion` / `report` : un texte (`description`), un signalement visant un item.
      required: [id, kind, status, title, author, comment_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [catalog, schema_suggestion, report] }
        status:
          type: string
          enum: [draft, pending, changes_requested, accepted, rejected, withdrawn]
        title: { type: string, maxLength: 200 }
        description: { type: string }
        payload:
          $ref: "#/components/schemas/CatalogExport"
        base:
          type: object
          description: "Instantané des entités existantes modifiées, à la soumission (`items`, `relations` : id → attributs)."
          additionalProperties: true
        item_id: { type: string, format: uuid }
        author:
          $ref: "#/components/schemas/Owner"
        author_disabled:
          type: boolean
          description: Compte de l'auteur désactivé (proposition gardée pour la modération).
        reviewer:
          $ref: "#/components/schemas/Owner"
        review_comment: { type: string }
        comment_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    ProposalQuota:
      type: object
      required: [unlimited, waiting, limit, accepted, base, max, today, daily_limit]
      properties:
        unlimited:
          type: boolean
          description: Admin ou contributeur, sans quota.
        waiting:
          type: integer
          description: Propositions en attente ou à corriger.
        limit:
          type: integer
          description: Propositions en attente permises (base + acceptées, plafonnée à `max`).
        accepted: { type: integer }
        base:
          type: integer
          description: "`PROPOSAL_QUOTA`."
        max: { type: integer }
        today:
          type: integer
          description: Propositions créées dans les dernières 24 h.
        daily_limit: { type: integer }

    ProposalInput:
      type: object
      description: Création (`kind` requis) ou modification d'une proposition en brouillon ou à corriger.
      required: [title]
      properties:
        kind: { type: string, enum: [catalog, schema_suggestion, report] }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        payload:
          $ref: "#/components/schemas/CatalogExport"
        item_id: { type: string, format: uuid }
        submit:
          type: boolean
          description: Création seulement — soumettre aussitôt (sinon brouillon).

    ProposalDecision:
      type: object
      description: Refus ou demande de modifications ; le commentaire est obligatoire.
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 10000 }

    ProposalAccept:
      type: object
      properties:
        payload:
          $ref: "#/components/schemas/CatalogExport"
          description: Charge corrigée par le modérateur (sinon celle de l'auteur).
        conflicts_resolved:
          type: boolean
          description: Le modérateur a tranché les conflits (sinon 409 `proposal_conflict` s'il y en a).
        comment: { type: string, maxLength: 10000 }

    ProposalConflict:
      type: object
      description: Entité modifiée par la proposition et changée depuis sa soumission (départ / actuel / proposé).
      required: [kind, id]
      properties:
        kind: { type: string, enum: [item, relation] }
        id: { type: string, format: uuid }
        base: { type: [object, "null"], additionalProperties: true }
        current: { type: [object, "null"], additionalProperties: true, description: "`null` : supprimée depuis." }
        proposed: { type: [object, "null"], additionalProperties: true }

    ProposalComment:
      type: object
      required: [id, author, body, created_at]
      properties:
        id: { type: string, format: uuid }
        author:
          $ref: "#/components/schemas/Owner"
        body: { type: string }
        created_at: { type: string, format: date-time }

    DuplicateCheck:
      type: object
      required: [item_type_id, attributes]
      properties:
        item_type_id: { type: string, format: uuid }
        attributes: { type: object, additionalProperties: true }
        exclude_id:
          type: string
          format: uuid
          description: Item en cours de modification (ignoré).

    Duplicate:
      type: object
      description: Item existant qui porte la même valeur pour un champ `x-identifier`.
      required: [field, value, item]
      properties:
        field:
          type: string
          description: Chemin du champ, `isbn` ou `external_ids.wikidata`.
        value: { type: string }
        item:
          $ref: "#/components/schemas/Item"

    Notification:
      type: object
      description: |
        Événement pour l'utilisateur connecté (P4-3c). `kind` : `proposal_accepted`, `proposal_rejected`,
        `proposal_changes_requested` (décision sur une de mes propositions), `proposal_comment` (nouveau message
        dans une discussion à laquelle je participe). `payload` : `proposal_id`, `title`, et `by` (auteur de
        l'événement, nom d'utilisateur).
      required: [id, kind, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [proposal_accepted, proposal_rejected, proposal_changes_requested, proposal_comment]
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }

    Error:
      type: object
      description: |
        Format d'erreur standard. Toutes les erreurs API suivent ce format.
        Le client affiche l'erreur en traduisant le code `error` dans la langue de l'utilisateur ;
        `message` n'est qu'un repli technique (en anglais, non traduit, susceptible d'évoluer).
        Le champ `details` est optionnel et peut contenir des informations
        spécifiques au type d'erreur (ex: erreurs de validation par champ).
      properties:
        error:
          type: string
          description: |
            Code d'erreur machine **stable**, destiné à être traduit côté client (clé i18n).
            Valeurs émises : `bad_request` (400), `unauthorized` (401), `forbidden` (403),
            `not_found` (404), `conflict` (409), `payload_too_large` (413),
            `validation_error` (422), `rate_limited` (429), `internal` (500),
            `timeout` (503, exploration du graphe trop longue), `connector_unavailable` (409, types d'un
            connecteur absents du catalogue), `external_unavailable` (502, source externe injoignable),
            `item_type_not_allowed` (422, type d'item non permis par le type de collection),
            `image_too_large` (400, image de plus de 25 mégapixels), `upload_quota` (429, quota horaire
            d'envoi d'images du compte). Comptes (P4-0) : `account_disabled` (401), `invalid_invitation` (401),
            `invalid_reset_link` (401), `invalid_username`, `invalid_email`, `weak_password` (400),
            `account_exists`, `invitation_used`, `self_lockout`, `last_admin` (409), `wrong_password` (403).
            Propositions (P4-3) : `proposal_state`, `proposal_quota`, `proposal_invalid`, `proposal_conflict`,
            `proposal_meta_types`, `own_proposal`. Avis (I-0) : `reviews_closed` (409). Modération (I-1) :
            `report_exists`, `moderation_state` (409), `own_content` (403), `rate_limited` (429). Commentaires (I-2) :
            `comments_closed` (409). Amis (P7-2) : `friendship_exists`, `member_blocked`, `friend_links_limit` (409). Prêts (P7-3) : `not_lendable`, `borrower_not_friend`, `loan_exceeds_lot` (422). Cadeaux (P7-4) : `reservation_exceeds_lot` (422). Chaque réponse d'erreur d'une opération nomme les codes qu'elle
            émet. Un client doit prévoir un libellé générique pour un code inconnu.
          example: validation_error
        message:
          type: string
          description: |
            Texte technique en anglais, destiné au débogage et aux journaux ; non traduit,
            son libellé exact n'est pas garanti. L'interface utilisateur s'appuie sur `error`.
          example: attributes do not match the item type schema
        details:
          type: object
          description: |
            Détails additionnels. Pour les erreurs de validation, contient les champs
            invalides et la raison de l'erreur pour chacun.
            Pour `connector_unavailable`, `missing` liste les noms de types introuvables.
          example:
            fields:
              "/": "missing properties: 'title'"
              "/start_year": "must be >= 1900 but found 1800"

    RelatedItemCollections:
      type: object
      description: Un item lié et les collections de l'utilisateur qui le contiennent.
      required: [item_id, collections]
      properties:
        item_id: { type: string, format: uuid }
        collections:
          type: array
          description: Un élément par lot (une collection peut revenir si l'item y forme plusieurs lots).
          items:
            type: object
            required: [id, name, collection_type_id, attributes]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              collection_type_id:
                type: string
                format: uuid
                description: Pour lire `attributes` avec le schéma du CollectionType.
              attributes:
                type: object
                additionalProperties: true
                description: Attributs contextuels de l'item dans cette collection (état, prix…).
              lot_id: { type: string, format: uuid }
              quantity: { type: integer }

    OfflineSnapshot:
      type: object
      description: Copie hors ligne des collections de l'utilisateur (`GET /me/offline`).
      required: [generated_at, user, item_types, collection_types, collections, items, entries]
      properties:
        generated_at: { type: string, format: date-time }
        user:
          $ref: "#/components/schemas/User"
        item_types:
          type: array
          items:
            $ref: "#/components/schemas/ItemType"
        collection_types:
          type: array
          items:
            $ref: "#/components/schemas/CollectionType"
        collections:
          type: array
          description: Collections de l'utilisateur (sans `collection_type` joint).
          items:
            $ref: "#/components/schemas/Collection"
        items:
          type: array
          description: Items de ses collections, une fois chacun (sans `item_type` joint).
          items:
            $ref: "#/components/schemas/Item"
        entries:
          type: array
          items:
            type: object
            required: [id, collection_id, item_id, quantity, attributes, added_at]
            properties:
              id: { type: string, format: uuid, description: Identifiant du lot. }
              collection_id: { type: string, format: uuid }
              item_id: { type: string, format: uuid }
              quantity: { type: integer }
              attributes: { type: object, additionalProperties: true }
              added_at: { type: string, format: date-time }

    DomainInfo:
      type: object
      required: [id, title, description, package_version, requires, status, modified_locally, item_types, relation_types, collection_types]
      properties:
        id: { type: string, example: books }
        title:
          type: object
          additionalProperties: { type: string }
          example: { fr: Livres, en: Books }
        description:
          type: object
          additionalProperties: { type: string }
        package_version: { type: integer, description: Version du paquet embarqué. }
        requires:
          type: array
          items: { type: string }
          description: Paquets requis (types utilisés par ses relations, ex. `people` pour `books`), installés avant lui.
        installed_version: { type: integer, description: Version installée (absente si jamais installé). }
        status:
          type: string
          enum: [not_installed, up_to_date, update_available]
        modified_locally: { type: boolean }
        item_types: { type: integer }
        relation_types: { type: integer }
        collection_types: { type: integer }
        review_types: { type: integer }
    DomainInstallReport:
      type: object
      required: [dry_run, applied, domain, to_version, entries, errors]
      properties:
        dry_run: { type: boolean }
        applied: { type: boolean }
        domain: { type: string }
        from_version: { type: integer, description: Version installée avant (absente à la première installation). }
        to_version: { type: integer }
        required:
          type: array
          description: |
            Paquets requis qui n'étaient pas installés : installés d'abord, dans la même transaction (un rapport
            chacun ; la simulation les inclut).
          items: { $ref: "#/components/schemas/DomainInstallReport" }
        entries:
          type: array
          items:
            type: object
            required: [entity, id, name, outcome]
            properties:
              entity:
                type: string
                enum: [item_types, collection_types, relation_types, review_types]
              id: { type: string, format: uuid }
              name: { type: string }
              outcome:
                type: string
                enum: [created, updated, merged, unchanged, skipped]
                description: |
                  `merged` : modifié localement, ajouts du paquet fusionnés ; `skipped` : supprimé
                  localement, ou relation dont une extrémité manque.
              conflicts:
                type: array
                items: { type: string }
                description: Chemins modifiés des deux côtés (valeur locale gardée).
              missing_types:
                type: array
                items: { type: string, format: uuid }
                description: Types d'item référencés par le paquet mais absents de l'instance.
        errors:
          type: array
          description: Erreurs d'écriture (mêmes entrées que celles du rapport d'import).
          items:
            type: object
            required: [entity, index, message]
            properties:
              entity: { type: string }
              index: { type: integer }
              id: { type: string, format: uuid }
              message: { type: string }

    # -------------------------------------------------------------------------
    # Upload
    # -------------------------------------------------------------------------
    CatalogExport:
      type: object
      description: |
        Catalogue complet (format `collectionnard.catalog`, version 1) : méta-types, items (avec
        les noms de leurs tags) et relations, chaque liste triée par `id` pour des diffs stables.
        Sans horodatage par entité ni données d'utilisateur. Accepté tel quel par `POST /import`.
      required: [format, version, item_types, relation_types, collection_types, items, relations]
      properties:
        format:
          type: string
          enum: [collectionnard.catalog]
        version:
          type: integer
          enum: [1]
        exported_at:
          type: string
          format: date-time
          description: Informatif, ignoré à l'import.
        review_types:
          type: array
          description: Types d'avis (absent des fichiers antérieurs à I-0).
          items:
            allOf:
              - $ref: "#/components/schemas/ExportMetaType"
              - type: object
                properties:
                  context_relation_type_ids:
                    type: array
                    items: { type: string, format: uuid }
                    description: Absent à l'import → liste conservée ; une relation inconnue de l'instance est ignorée.
                  context_label:
                    type: object
                    additionalProperties: { type: string }
        item_types:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ExportMetaType"
              - type: object
                properties:
                  display_order:
                    type: integer
                    description: Absent à l'import → 100 pour un nouveau type, valeur conservée sinon.
                  review_type_id:
                    type: string
                    format: uuid
                    description: Type d'avis ; absent à l'import → valeur conservée.
        collection_types:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ExportMetaType"
              - type: object
                properties:
                  item_type_ids:
                    type: array
                    items: { type: string, format: uuid }
                    description: Types d'item permis (vide = tous) ; absent à l'import → liste conservée.
        relation_types:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ExportMetaType"
              - type: object
                required: [source_item_type_ids, target_item_type_ids]
                properties:
                  source_item_type_ids:
                    type: array
                    items: { type: string, format: uuid }
                  target_item_type_ids:
                    type: array
                    items: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            required: [id, item_type_id, attributes]
            properties:
              id: { type: string, format: uuid }
              item_type_id: { type: string, format: uuid }
              attributes: { type: object, additionalProperties: true }
              tags:
                type: array
                items: { type: string }
                description: Noms des tags ; à l'import, remplace l'ensemble des tags de l'item.
        relations:
          type: array
          items:
            type: object
            required: [id, relation_type_id, source_item_id, target_item_id]
            properties:
              id: { type: string, format: uuid }
              relation_type_id: { type: string, format: uuid }
              source_item_id: { type: string, format: uuid }
              target_item_id: { type: string, format: uuid }
              attributes: { type: object, additionalProperties: true }
    ExportMetaType:
      type: object
      required: [id, name, attributes_schema]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        attributes_schema: { type: object, additionalProperties: true }
    ImportReport:
      type: object
      description: |
        Résultat d'un import. `applied` est vrai seulement si l'import a été validé (aucune
        erreur et pas `dry_run`). Une entité identique à l'existant compte comme `unchanged`.
      required: [dry_run, applied, counts, errors]
      properties:
        dry_run: { type: boolean }
        applied: { type: boolean }
        collection_id:
          type: string
          format: uuid
          description: Import de collection seulement — collection créée ou mise à jour.
        counts:
          type: object
          description: |
            Par liste : `item_types`, `collection_types`, `relation_types`, `items`, `relations` pour le
            catalogue ; `collection` et `items` pour une collection (`removed` : items retirés).
          additionalProperties:
            type: object
            required: [created, updated, unchanged]
            properties:
              created: { type: integer }
              updated: { type: integer }
              unchanged: { type: integer }
              removed: { type: integer }
        errors:
          type: array
          description: Au plus 100 erreurs, dans l'ordre du fichier.
          items:
            type: object
            required: [entity, index, message]
            properties:
              entity:
                type: string
                enum: [file, item_types, collection_types, relation_types, review_types, items, relations, collection]
              index:
                type: integer
                description: Position dans la liste (0-based), -1 pour une erreur de fichier.
              id: { type: string, format: uuid }
              message:
                type: string
                description: Texte technique en anglais (cause, champ fautif).
      example:
        dry_run: true
        applied: false
        counts:
          items: { created: 2, updated: 0, unchanged: 8 }
        errors:
          - entity: items
            index: 3
            id: e0000000-0000-0000-0000-000000000099
            message: "attributes: /start_year: must be >= 1900 but found 1800"
    CollectionExport:
      type: object
      description: Collection d'un utilisateur et ses items (format `collectionnard.collection`, version 1).
      required: [format, version, collection, items]
      properties:
        format: { type: string, enum: [collectionnard.collection] }
        version: { type: integer, enum: [1] }
        exported_at: { type: string, format: date-time }
        collection:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            description: { type: string }
            collection_type: { $ref: "#/components/schemas/ExportMetaType" }
            item_type_ids:
              type: array
              items: { type: string, format: uuid }
              description: Types d'item acceptés (P7-1b) ; à l'import, un type inconnu de l'instance est ignoré.
            default_sort: { type: string, description: Tri par défaut (P7-1b). }
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: |
                  Identifiant du lot (P7-1). À l'import, un lot de la collection cible portant cet identifiant est mis à
                  jour ; absent (fichier antérieur), le lot est rapproché par item.
              item_id: { type: string, format: uuid }
              item_type: { type: string, description: Nom technique de l'ItemType. }
              quantity: { type: integer, minimum: 1, default: 1, description: "Exemplaires du lot (absent : 1)." }
              label: { type: string, description: Libellé (`x-label`) dans la langue `lang`. }
              item_attributes: { type: object, additionalProperties: true }
              attributes:
                type: object
                additionalProperties: true
                description: Attributs contextuels (schéma du CollectionType).
              added_at: { type: string, format: date-time }
    ExternalWorkHit:
      type: object
      description: Œuvre trouvée par un connecteur — œuvre Wikidata (livres) ou groupe de parutions MusicBrainz (album).
      required: [id, label, item_type_id, source_url]
      properties:
        id:
          type: string
          description: Identifiant à la source (QID Wikidata, MBID du groupe de parutions) — le `work` d'une sélection.
          example: Q15051307
        wikidata_id: { type: string, example: Q15051307, description: Connecteurs livres seulement (= `id`). }
        label: { type: string, description: "Libellé Wikidata (fr, à défaut en), titre de l'album." }
        description: { type: string, description: "Album : artiste crédité et types (« Radiohead · Album »)." }
        item_type_id:
          type: string
          format: uuid
          description: ItemType proposé (`Manga`, `Comic`, `Novel`, `Album`).
        start_year: { type: integer }
        existing_item_id:
          type: string
          format: uuid
          description: Item du catalogue portant déjà ce QID.
        source_url: { type: string, format: uri }
    ExternalEditionHit:
      type: object
      description: |
        Édition trouvée à la BnF : ensemble multivolume (zone 461 des tomes) ou collection éditoriale
        (zone 410) ; pour un roman en un volume, le livre lui-même (`isbn`). Connecteur `music` : une parution
        MusicBrainz (release).
      required: [id, title, publishers, source_url]
      properties:
        id:
          type: string
          description: Identifiant à la source (ARK BnF, MBID de la parution) — l'un des `editions` d'une sélection.
          example: "ark:/12148/cb343384394"
        bnf_ark: { type: string, example: "ark:/12148/cb343384394", description: Connecteurs livres seulement (= `id`). }
        title: { type: string }
        publishers: { type: array, items: { type: string }, description: "Éditeurs, ou labels d'une parution." }
        artist: { type: string, description: Musique — artiste crédité (recherche par titre ou code-barres). }
        format: { type: string, description: "Musique — supports : « CD », « 2×12\" Vinyl », « 2×CD + DVD-Video »." }
        country: { type: string, description: "Musique — pays de parution (ISO 3166-1, XE Europe, XW monde)." }
        barcode: { type: string }
        catalog_number: { type: string, description: Musique — référence catalogue du label. }
        start_year: { type: integer }
        language:
          type: string
          description: Langue du texte (ISO 639-1, sinon code BnF à trois lettres) ; absente si indéterminée.
        collection: { type: string, description: "Collection éditoriale et numéro : « Folio 2 »." }
        isbn: { type: string, description: Édition en un volume seulement. }
        existing_item_id: { type: string, format: uuid }
        source_url: { type: string, format: uri }
        matched_volume:
          type: object
          description: Recherche par ISBN seulement — le tome qui porte cet ISBN.
          required: [bnf_ark, title]
          properties:
            bnf_ark: { type: string }
            number: { type: integer }
            title: { type: string }
            isbn: { type: string }
    ExternalImportRequest:
      type: object
      description: |
        Sélection d'une œuvre et / ou d'éditions (au moins l'une des deux) : QID Wikidata et ARK BnF (livres),
        MBID d'un groupe de parutions et de parutions (`music`).
      properties:
        work:
          type: string
          description: Œuvre — QID Wikidata (`^Q[1-9][0-9]*$`) ou MBID du groupe de parutions.
        editions:
          type: array
          maxItems: 10
          items: { type: string }
          description: |
            Éditions — ARK BnF (`^ark:/12148/cb[0-9]{8,9}[0-9bcdfghjkmnpqrstvwxz]$`, leurs tomes sont proposés) ou MBID
            de parutions (leurs pistes, labels et artistes sont proposés ; sans `work`, l'album vient de la parution).
        selected:
          type: array
          items: { type: string }
          description: Import seulement — clés (`key`) des nœuds de l'aperçu à écrire.
        title:
          type: string
          maxLength: 200
          description: Titre de la proposition (`propose` seulement ; à défaut, le connecteur).
        overrides:
          type: object
          description: |
            Import seulement — corrections faites dans l'aperçu : clé de nœud → attributs complets, qui
            remplacent ceux proposés (validés contre le schéma du type par l'import). Le nœud doit être
            sélectionné. Pour un tome, l'ordre dans son édition suit le `number` corrigé.
          additionalProperties: { type: object, additionalProperties: true }
      example:
        work: Q15051307
        editions: ["ark:/12148/cb343384394"]
    ExternalNode:
      type: object
      description: |
        Item proposé. `attributes` est ce qui serait écrit : les valeurs existantes complétées par la
        source. Un nœud non sélectionné n'est pas écrit ; une relation est écrite quand chacune de ses
        extrémités est sélectionnée ou déjà dans le catalogue.
      required: [key, role, item_type_id, attributes, status, selected, source_url]
      properties:
        key:
          type: string
          description: Identifiant du nœud (`wikidata:Q…`, `bnf:cb…`, `publisher:<nom>`).
        role:
          type: string
          enum: [work, universe, person, edition, season, publisher, volume]
          description: Vocabulaire du connecteur ; `season` = saison d'une série (ses épisodes ont le rôle `volume`), `universe` = aussi la diffusion d'une série.
        item_type_id: { type: string, format: uuid }
        attributes: { type: object, additionalProperties: true }
        existing_item_id: { type: string, format: uuid }
        status:
          type: string
          enum: [new, update, unchanged]
          description: "`new` créé, `update` item existant dont des champs vides seront remplis, `unchanged` rien à ajouter."
        selected:
          type: boolean
          description: Sélection par défaut (faux pour une réimpression ou un tome sans numéro).
        parent: { type: string, description: Clé du nœud dont il dépend (affichage en arbre). }
        source_url: { type: string, format: uri }
        note:
          type: string
          enum: [reprint, no_number]
          description: "`reprint` un autre tome de l'édition a le même numéro, `no_number` numéro absent de la notice (0 proposé)."
    ExternalRelation:
      type: object
      required: [relation_type_id, from, to, attributes]
      properties:
        relation_type_id: { type: string, format: uuid }
        from: { type: string, description: Clé du nœud source. }
        to: { type: string, description: Clé du nœud cible. }
        attributes: { type: object, additionalProperties: true }
        existing_id: { type: string, format: uuid, description: Relation déjà présente (réutilisée). }
    ExternalPlan:
      type: object
      required: [retrieved_at, nodes, relations]
      properties:
        retrieved_at: { type: string, format: date, description: Date de récupération (écrite dans `sources`). }
        nodes: { type: array, items: { $ref: "#/components/schemas/ExternalNode" } }
        relations: { type: array, items: { $ref: "#/components/schemas/ExternalRelation" } }
    ExternalImportReport:
      allOf:
        - $ref: "#/components/schemas/ImportReport"
        - type: object
          required: [item_ids]
          properties:
            item_ids:
              type: object
              description: Clé de nœud → id de l'item écrit (les nouveaux id ne valent qu'une fois l'import appliqué).
              additionalProperties: { type: string, format: uuid }
    UploadResponse:
      type: object
      description: Réponse après un upload réussi.
      properties:
        url:
          type: string
          description: Chemin relatif pour accéder au fichier uploadé.
          example: /api/v1/uploads/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08.jpg
        filename:
          type: string
          description: |
            Nom du fichier : SHA-256 du contenu + extension (les fichiers envoyés avant cette règle
            gardent leur nom UUID).
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08.jpg
        size:
          type: integer
          description: Taille du fichier écrit sur le disc, en octets.
          example: 245760
        reused:
          type: boolean
          description: "Un fichier identique existait déjà : même URL, rien n'a été réécrit."
          example: false

    UploadPurgeReport:
      type: object
      description: Résultat de `POST /uploads/purge`.
      required: [dry_run, applied, files, total_size, referenced, recent, grace_hours]
      properties:
        dry_run: { type: boolean }
        applied:
          type: boolean
          description: Vrai si les fichiers listés ont été supprimés.
        files:
          type: array
          description: Images inutilisées et plus anciennes que le délai de grâce.
          items:
            type: object
            required: [filename, size, modified_at]
            properties:
              filename: { type: string }
              size: { type: integer, description: Octets. }
              modified_at: { type: string, format: date-time }
        total_size:
          type: integer
          description: Taille cumulée de `files`, en octets.
        referenced:
          type: integer
          description: Images encore utilisées (conservées).
        recent:
          type: integer
          description: Images inutilisées mais dans le délai de grâce (conservées).
        grace_hours:
          type: integer
          example: 24

  # ===========================================================================
  # Paramètres réutilisables
  # ===========================================================================
  parameters:
    loanStatus:
      name: status
      in: query
      description: "`active` : en cours ; `returned` : rendus ; absent : tous."
      schema: { type: string, enum: [active, returned] }
    lotId:
      name: lotId
      in: path
      required: true
      description: Identifiant du lot (`CollectionItem.id`, P7-1).
      schema: { type: string, format: uuid }
    username:
      name: username
      in: path
      required: true
      schema: { type: string }
    collectionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    friendLinkToken:
      name: token
      in: path
      required: true
      description: Jeton d'un lien d'ami.
      schema: { type: string }
    shareToken:
      name: token
      in: query
      required: true
      description: Jeton d'un lien de partage.
      schema: { type: string }
    connector:
      name: connector
      in: path
      required: true
      description: Connecteur (`GET /external/connectors`) — `bd-manga`, `novels`, `music`, `films`, `series`, `games`…
      schema:
        type: string
        example: bd-manga
    page:
      name: page
      in: query
      description: Numéro de page (1-indexed). Défaut 1.
      schema:
        type: integer
        default: 1
        minimum: 1
    csvDelimiter:
      name: delimiter
      in: query
      description: Séparateur CSV (`semicolon` pour un tableur configuré en français).
      schema:
        type: string
        enum: [comma, semicolon, tab]
        default: comma
    lang:
      name: lang
      in: query
      description: Langue des libellés (`x-label`) et des objets i18n affichés ; défaut `fr`.
      schema:
        type: string
        default: fr
    per_page:
      name: per_page
      in: query
      description: Nombre d'éléments par page. Défaut 20 ; une valeur > 100 est ramenée à 100, une valeur < 1 à 20.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  # ===========================================================================
  # Réponses réutilisables
  # ===========================================================================
  responses:
    CollectionItemPage:
      description: Exemplaires paginés, attributs cachés retirés pour tout autre lecteur que le propriétaire.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - properties:
                  data:
                    items:
                      $ref: "#/components/schemas/CollectionItem"
    NotFound:
      description: |
        Ressource non trouvée. L'ID spécifié ne correspond à aucun élément existant,
        ou l'utilisateur n'a pas accès à cette ressource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
            message: resource not found
    Unauthorized:
      description: |
        Non authentifié. Le token JWT est absent, expiré ou invalide.
        Utilisez `POST /auth/refresh` (refresh token valide) ou `POST /auth/login`
        pour obtenir un nouveau token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
            message: invalid or expired token
    Forbidden:
      description: |
        Droits insuffisants. L'utilisateur est authentifié mais son rôle
        ne permet pas cette opération (ex: un user tente de créer un ItemType).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: forbidden
            message: admin role required
    ValidationError:
      description: |
        Erreur de validation. Les données envoyées ne respectent pas le JSON Schema
        du type concerné, ou une contrainte métier n'est pas satisfaite.
        Le champ `details.fields` liste les erreurs par champ.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: validation_error
            message: attributes do not match the item type schema
            details:
              fields:
                "/": "missing properties: 'title'"
                "/start_year": "must be >= 1900 but found 1800"
    Conflict:
      description: |
        Conflit. L'opération est impossible car elle violerait une contrainte d'unicité
        (ex: doublon de relation, item déjà dans la collection, nom de type déjà utilisé).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: conflict
            message: this item is already in the collection
    TooManyRequests:
      description: |
        Trop de requêtes depuis cette adresse IP sur les endpoints `/auth/*`
        (limite `LOGIN_RATE_LIMIT` par minute, défaut 10). Deux compteurs distincts :
        l'un pour `login`, `register`, `reset-password` et `invitation` (identifiants et jetons à
        usage unique), l'autre pour `refresh` et `logout` (appelés par chaque appareil toutes les
        `ACCESS_TOKEN_TTL`). Le header `Retry-After` indique le délai d'attente en secondes.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secondes à attendre avant de réessayer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: rate_limited
            message: too many attempts, retry in 42 s
    PayloadTooLarge:
      description: |
        Corps de requête JSON supérieur à 1 Mio (les uploads ont leur propre limite,
        `MAX_UPLOAD_SIZE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: payload_too_large
            message: request body too large (max 1048576 bytes)

    ConnectorUnavailable:
      description: |
        Le catalogue ne contient pas tous les types du domaine BD / Manga que le connecteur écrit
        (`db/seed_bd_manga.sql`), reconnus par leur nom technique exact : `details.missing` liste
        les noms introuvables (seed non chargé ou type renommé).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: connector_unavailable
            message: "BD / Manga types missing from the catalogue: Volume, contains_volume"
            details:
              missing: [Volume, contains_volume]
    ExternalUnavailable:
      description: Source externe (Wikidata, BnF) injoignable, trop lente ou réponse illisible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: external_unavailable
            message: "external source unavailable: catalogue.bnf.fr answered HTTP 503"

    BadRequest:
      description: |
        Requête invalide : UUID de chemin ou de filtre mal formé, JSON illisible, paramètre hors
        bornes (`max_depth`, `sort`…) ou champ obligatoire manquant dans le corps.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: bad_request
            message: "invalid UUID: id"
    InternalError:
      description: |
        Erreur interne. La cause est journalisée côté serveur avec le `request_id` de la requête ;
        le message renvoyé est volontairement générique.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal
            message: internal error

# =============================================================================
# ENDPOINTS
# =============================================================================
paths:
  # ===========================================================================
  # Health
  # ===========================================================================
  /healthz:
    get:
      tags: [Health]
      summary: État de santé
      description: |
        Vérifie que l'API répond et que PostgreSQL est joignable (`Ping`).
        Aucune authentification, aucune limitation de débit.
      operationId: healthz
      security: []
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: API et base de données opérationnelles.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        "503":
          description: Base de données injoignable.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                    enum: [degraded]
                  error:
                    type: string
              example:
                status: degraded
                error: database

  # ===========================================================================
  # Auth
  # ===========================================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Authentification
      description: |
        Authentifie un utilisateur et retourne un access token JWT et un refresh token.
        L'access token doit être envoyé dans le header `Authorization: Bearer <token>`
        pour tous les appels authentifiés.

        L'access token expire après `ACCESS_TOKEN_TTL` (défaut 15 min, voir `expires_in`) ;
        le client le renouvelle avec `POST /auth/refresh`. Le refresh token expire après
        `REFRESH_TOKEN_TTL` (défaut 30 jours) et est révoqué par `POST /auth/logout`.

        Limité à `LOGIN_RATE_LIMIT` appels par minute et par adresse IP (défaut 10).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Connexion réussie. Le token JWT est dans le champ `token`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: JSON invalide ou `username` / `password` manquant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Identifiants invalides (`unauthorized`) ou compte désactivé (`account_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                credentials:
                  value:
                    error: unauthorized
                    message: invalid username or password
                disabled:
                  value:
                    error: account_disabled
                    message: this account is disabled
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouvellement des tokens
      description: |
        Échange un refresh token valide contre un nouvel access token **et** un nouveau
        refresh token. Le refresh token présenté est invalidé (rotation) : un token déjà
        consommé, expiré ou révoqué renvoie 401 et le client doit se reconnecter.

        L'utilisateur est relu en base : un compte supprimé ou dont le rôle a changé est
        pris en compte au plus tard au prochain refresh.

        Soumis à la même limitation de débit que `/auth/login`.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Nouveaux tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: JSON invalide ou `refresh_token` manquant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Refresh token inconnu, expiré, déjà utilisé ou utilisateur supprimé (`unauthorized`) ;
            compte désactivé entre-temps (`account_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unauthorized
                message: invalid or expired refresh token
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: |
        Révoque le refresh token présenté. L'access token courant reste valide jusqu'à
        son expiration (au plus `ACCESS_TOKEN_TTL`). Révoquer un token inconnu n'est pas
        une erreur (204 également).
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Refresh token révoqué.
        "400":
          description: JSON invalide ou `refresh_token` manquant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil de l'utilisateur courant
      description: Retourne le profil complet de l'utilisateur identifié par le token JWT.
      operationId: getCurrentUser
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Profil de l'utilisateur authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/invitation:
    get:
      tags: [Auth]
      summary: Vérifier une invitation
      description: |
        Public. Indique si le jeton d'invitation permet encore de créer un compte (ni utilisé, ni expiré, ni
        retiré). Limité comme `/auth/login`.
      operationId: checkInvitation
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validité de l'invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCheck" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte depuis une invitation
      description: |
        Public. Crée le compte avec le rôle de l'invitation, consomme l'invitation (usage unique) et connecte
        l'utilisateur (même réponse que `POST /auth/login`). Limité comme `/auth/login`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Compte créé et connecté.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: |
            JSON invalide ou jeton manquant (`bad_request`) ; nom d'utilisateur hors format, 2 à 100 lettres,
            chiffres, « _ », « . » ou « - » (`invalid_username`) ; adresse e-mail invalide (`invalid_email`) ;
            mot de passe de moins de 8 caractères ou de plus de 72 octets (`weak_password`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: weak_password, message: "password: 8 characters minimum" }
        "401":
          description: Invitation inconnue, utilisée, expirée ou retirée (`invalid_invitation`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Nom d'utilisateur (sans casse) ou adresse e-mail déjà utilisé (`account_exists`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: account_exists, message: username or email already in use }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Choisir un nouveau mot de passe
      description: |
        Public. Consomme un lien de réinitialisation (`POST /users/{id}/reset-link`), change le mot de passe et
        révoque les jetons de rafraîchissement du compte. Limité comme `/auth/login`.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Mot de passe changé. }
        "400":
          description: |
            JSON invalide ou jeton manquant (`bad_request`) ; mot de passe de moins de 8 caractères ou de plus
            de 72 octets (`weak_password`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Lien inconnu, utilisé ou expiré (`invalid_reset_link`), ou compte désactivé (`account_disabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/profile:
    put:
      tags: [Users]
      summary: Modifier mon profil
      description: Nom affiché, présentation et avatar de l'utilisateur courant.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Profil modifié.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/password:
    put:
      tags: [Users]
      summary: Changer mon mot de passe
      description: |
        Vérifie le mot de passe actuel, enregistre le nouveau et révoque toutes les sessions (jetons de
        rafraîchissement) ; la session courante en reçoit de nouveaux (même réponse que `POST /auth/login`).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "200":
          description: Mot de passe changé ; nouveaux jetons de la session courante.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: |
            JSON invalide ou champ manquant (`bad_request`) ; nouveau mot de passe de moins de 8 caractères ou
            de plus de 72 octets (`weak_password`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Mot de passe actuel incorrect (`wrong_password`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /invitations:
    get:
      tags: [Users]
      summary: Lister les invitations
      description: Les invitations créées par l'utilisateur ; toutes pour un admin. Les plus récentes d'abord.
      operationId: listInvitations
      responses:
        "200":
          description: Invitations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Users]
      summary: Créer une invitation
      description: |
        Admin, ou membre si `MEMBER_INVITES=true` (un membre n'invite que des utilisateurs). Le jeton est renvoyé
        cette seule fois ; le client en fait le lien `/register?token=…`.
      operationId: createInvitation
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Invitation créée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /invitations/{id}:
    delete:
      tags: [Users]
      summary: Retirer une invitation
      description: Son auteur ou un admin ; une invitation déjà utilisée ne peut plus être retirée (409).
      operationId: deleteInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Invitation retirée. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Invitation déjà utilisée (`invitation_used`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: invitation_used, message: invitation already used }
        "500": { $ref: "#/components/responses/InternalError" }

  /users:
    get:
      tags: [Users]
      summary: Lister les comptes
      description: "**Admin uniquement.** Tous les comptes, par nom d'utilisateur."
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Comptes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{id}:
    put:
      tags: [Users]
      summary: Modifier un compte
      description: |
        **Admin uniquement.** Rôle et désactivation. Un admin ne peut ni se désactiver ni retirer son propre rôle
        admin ; le dernier admin actif ne peut pas être rétrogradé ni désactivé (409 `last_admin`).
      operationId: updateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Compte modifié.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            L'admin tente de se désactiver ou de se retirer le rôle admin (`self_lockout`) ; le compte visé est
            le dernier admin actif (`last_admin`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                self:
                  value: { error: self_lockout, message: an admin cannot disable or demote themself }
                last:
                  value: { error: last_admin, message: the last active admin cannot be disabled or demoted }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{id}/reset-link:
    post:
      tags: [Users]
      summary: Créer un lien de réinitialisation du mot de passe
      description: |
        **Admin uniquement.** Lien à usage unique, valable 24 h, que l'admin transmet lui-même (pas d'envoi
        d'e-mail). Les liens précédents du compte non utilisés sont annulés.
      operationId: createResetLink
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Lien créé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ===========================================================================
  # Item Types (admin)
  # ===========================================================================
  /me/offline:
    get:
      tags: [Collections]
      summary: Copie hors ligne de mes collections
      description: |
        Tout ce que l'application mobile garde pour consulter les collections de l'utilisateur
        authentifié sans réseau (lecture seule) : ses collections, leurs items (une fois chacun,
        même présents dans plusieurs collections) et entrées (attributs contextuels), ainsi que
        tous les types d'item et de collection (schémas d'affichage). Réponse `Cache-Control:
        private, no-store` (données personnelles).
      operationId: getOfflineSnapshot
      responses:
        "200":
          description: Copie hors ligne.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /item-types:
    get:
      tags: [ItemTypes]
      summary: Lister les types d'items
      description: |
        Retourne la liste paginée de tous les types d'items disponibles.
        Triée par `display_order` puis par `name`.
        Utile pour le frontend : permet de peupler un sélecteur de type
        lors de la création d'un item.
      operationId: listItemTypes
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Liste paginée des types d'items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/ItemType"

    post:
      tags: [ItemTypes]
      summary: Créer un type d'item
      description: |
        **Admin uniquement.**

        Crée un nouveau type d'item avec son JSON Schema d'attributs.
        Ce JSON Schema sera utilisé pour :
        1. **Valider** les attributs de chaque item de ce type (création et modification)
        2. **Générer** dynamiquement les formulaires côté frontend
        3. **Documenter** les champs attendus

        Le `attributes_schema` doit être un JSON Schema valide avec `"type": "object"` à la racine.
      operationId: createItemType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemTypeCreate"
            example:
              name: Series
              description: Série télévisée
              attributes_schema:
                type: object
                required: [title]
                properties:
                  title: { type: string, minLength: 1 }
                  synopsis: { type: string }
                  start_year: { type: integer, minimum: 1900 }
                  end_year: { type: integer, minimum: 1900 }
                  poster: { type: string, format: uri }
                additionalProperties: false
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Type d'item créé avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemType"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Un type avec ce nom existe déjà.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /item-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID du type d'item.
        schema:
          type: string
          format: uuid
    get:
      tags: [ItemTypes]
      summary: Détail d'un type d'item
      description: |
        Retourne le type d'item avec son JSON Schema complet.
        Utile pour le frontend : récupérer le schéma avant d'afficher
        un formulaire de création/modification d'item.
      operationId: getItemType
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Type d'item trouvé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemType"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [ItemTypes]
      summary: Modifier un type d'item
      description: |
        **Admin uniquement.**

        Modifie un type d'item. Seuls les champs fournis sont mis à jour.

        **⚠️ Attention** : modifier le `attributes_schema` peut rendre les items existants
        invalides. Le serveur ne revalide pas automatiquement les items existants.
        Il est recommandé de rester rétro-compatible (ajouter des champs optionnels,
        ne pas supprimer de champ requis).
      operationId: updateItemType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemTypeUpdate"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Type modifié avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemType"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ItemTypes]
      summary: Supprimer un type d'item
      description: |
        **Admin uniquement.**

        Supprime un type d'item. **Échoue avec une erreur 409** s'il existe
        des items de ce type ou des RelationTypes qui le référencent.
        Il faut d'abord supprimer tous les items et relations dépendants.
      operationId: deleteItemType
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Type supprimé avec succès.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Impossible de supprimer — des items de ce type existent,
            ou des RelationTypes référencent ce type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # Relation Types (admin)
  # ===========================================================================
  /relation-types:
    get:
      tags: [RelationTypes]
      summary: Lister les types de relation
      description: |
        Retourne la liste paginée des types de relation.

        **Filtrage** : utilisez `source_item_type_id` et/ou `target_item_type_id`
        pour ne récupérer que les relations pertinentes. Utile côté frontend pour
        proposer les types de relation possibles lors de la création d'un lien
        depuis un item d'un type donné.
      operationId: listRelationTypes
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: source_item_type_id
          in: query
          description: |
            Filtrer par type d'item source. Retourne uniquement les RelationTypes
            dont les sources contiennent ce type.
          schema:
            type: string
            format: uuid
        - name: target_item_type_id
          in: query
          description: Filtrer par type d'item cible.
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Liste paginée des types de relation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/RelationType"

    post:
      tags: [RelationTypes]
      summary: Créer un type de relation
      description: |
        **Admin uniquement.**

        Crée un nouveau type de relation avec ses contraintes de types et son schéma d'attributs.
        Les ItemTypes source et cible référencés doivent exister.
      operationId: createRelationType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationTypeCreate"
            example:
              name: includes_episode
              description: "DVD incluant un épisode. Porte le numéro de disc et de track."
              source_item_type_ids:
                - b0000000-0000-0000-0000-000000000005
              target_item_type_ids:
                - b0000000-0000-0000-0000-000000000004
              attributes_schema:
                type: object
                properties:
                  disc: { type: integer, minimum: 1 }
                  track: { type: integer, minimum: 1 }
                additionalProperties: false
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Type de relation créé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationType"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Un type de relation avec ce nom existe déjà.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /relation-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID du type de relation.
        schema:
          type: string
          format: uuid
    get:
      tags: [RelationTypes]
      summary: Détail d'un type de relation
      description: |
        Retourne le type de relation avec ses contraintes et son JSON Schema.
        Inclut les ItemTypes source et cible complets.
      operationId: getRelationType
      responses:
