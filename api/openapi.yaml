          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Conflits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProposalConflict"

  /proposals/{id}/accept:
    post:
      tags: [Proposals]
      summary: Accepter une proposition
      description: |
        Modérateurs (admins, contributeurs), jamais sur leurs propres propositions (403 `own_proposal`), en attente
        seulement. `catalog` : application tout ou rien par l'import, historisée avec l'origine `proposal` et
        l'auteur de la proposition ; 409 `proposal_conflict` (avec les conflits) si une entité a changé et que
        `conflicts_resolved` n'est pas vrai.
      operationId: acceptProposal
      parameters:
        - $ref: "#/components/parameters/collectionId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalAccept"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Proposition acceptée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /proposals/{id}/reject:
    post:
