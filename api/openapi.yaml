      tags: [Friends]
      summary: Ouvrir un lien d'ami
      description: Qui m'invite (`user`). 404 si le lien est inconnu, expiré, déjà utilisé, ou si son auteur m'a bloqué.
      operationId: getFriendLink
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Le lien et son auteur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendLink"

  /friend-links/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/friendLinkToken"
    post:
      tags: [Friends]
      summary: Accepter un lien d'ami
      description: |
        Je deviens ami de l'auteur du lien, qui est notifié (`friend_accepted`) ; une demande en attente entre nous est
        acceptée. Le lien est consommé.
      operationId: acceptFriendLink
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`friendship_exists` : déjà amis (le lien reste valide) ; `member_blocked` : j'ai bloqué son auteur."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Mon propre lien.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Amitié acceptée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Friendship"

  /me/notifications:
    get:
      tags: [Users]
      summary: Mes notifications
      description: Les plus récentes d'abord ; `unread` compte toutes les non-lues.
      operationId: listNotifications
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, per_page, unread]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
                  unread: { type: integer }

  /me/notifications/read:
    post:
      tags: [Users]
      summary: Marquer des notifications comme lues
      description: "`ids` absent ou vide : toutes mes notifications."
      operationId: markNotificationsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Marquées comme lues.
