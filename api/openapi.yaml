      operationId: getProposal
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Proposition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
    put:
      tags: [Proposals]
      summary: Modifier une proposition
      description: Auteur, en brouillon ou à corriger (409 `proposal_state` sinon).
      operationId: updateProposal
      parameters:
        - $ref: "#/components/parameters/collectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Proposition modifiée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /proposals/{id}/submit:
    post:
      tags: [Proposals]
      summary: Soumettre une proposition
      description: Auteur, depuis brouillon ou à corriger ; l'instantané de départ est (re)pris à ce moment.
      operationId: submitProposal
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Proposition soumise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /proposals/{id}/withdraw:
    post:
      tags: [Proposals]
      summary: Retirer une proposition
      description: Auteur, avant décision.
      operationId: withdrawProposal
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Proposition retirée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /proposals/{id}/conflicts:
    get:
      tags: [Proposals]
