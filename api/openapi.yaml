              schema:
                $ref: "#/components/schemas/MeStats"

  /collections/{id}/stats:
    get:
      tags: [Stats]
      summary: Statistiques d'une collection
      description: |
        Collection de l'utilisateur connecté (404 pour celle d'un autre). Agrégats des attributs du
        CollectionType selon leur type, ajouts par mois et complétude par le graphe (relations
        `x-completeness`).
      operationId: getCollectionStats
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Statistiques de la collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionStats"
  # ===========================================================================
  # Import / export
  # ===========================================================================
  /export:
    get:
      tags: [ImportExport]
      summary: Exporter le catalogue (JSON)
      description: |
        Méta-types, items et relations, au format `collectionnard.catalog`. Servi en pièce jointe
        (`Content-Disposition: attachment; filename="collectionnard-catalog-<date>.json"`).
        Réservé aux admins.
      operationId: exportCatalog
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogExport"
  /import:
    post:
      tags: [ImportExport]
      summary: Importer un catalogue (JSON)
      description: |
        Importe un `CatalogExport` dans une transaction unique : chaque entité est créée si son
        `id` est inconnu, mise à jour sinon (remplacement complet, comme `PUT`) ; rien n'est jamais
        supprimé. Ordre : item_types, collection_types, relation_types (jonctions remplacées),
        items (tags remplacés), relations.

        Validation : schémas des méta-types (comme à l'écriture), attributs de chaque item et de
        chaque relation contre le schéma de leur type (celui du fichier s'il y figure, sinon celui
        de la base), types source / cible autorisés des relations, unicité des noms et des triplets
        (type, source, cible) des relations.

        Au moindre problème, **rien n'est appliqué** : réponse 422 avec le rapport complet.
        `dry_run=true` valide et compte sans rien écrire. Corps limité à `MAX_IMPORT_SIZE`
        (défaut 20 Mio). Réservé aux admins.
      operationId: importCatalog
      parameters:
        - name: dry_run
          in: query
          description: Simuler l'import (rapport complet, aucune écriture).
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogExport"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Import appliqué (ou simulation sans erreur).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "422":
          description: Erreurs de validation ; rien n'a été appliqué.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
  /items/export:
    get:
      tags: [ImportExport]
      summary: Exporter des items en CSV
      description: |
        Items d'un type (`item_type_id` obligatoire), avec les mêmes filtres et le même tri que
        `GET /items` (`search`, `tag`, `attr.*`, `related_to`, `sort`…), sans pagination
        (10 000 lignes au plus). UTF-8 avec BOM (ouverture directe dans un tableur).

        Colonnes : `id`, `label` (libellé `x-label` dans la langue `lang`), `tags` (séparés par
        `; `), puis une colonne par propriété du schéma dans l'ordre `x-order`, d'en-tête = la clé.
        Un objet i18n-text donne une colonne par langue (`synopsis.fr`, `synopsis.en`) ; un tableau
        de scalaires est joint par `; ` ; tout autre objet (galerie d'images) est écrit en JSON.
      operationId: exportItemsCsv
      parameters:
        - name: item_type_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/csvDelimiter"
        - $ref: "#/components/parameters/lang"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Fichier CSV en pièce jointe.
          content:
            text/csv:
              schema:
                type: string
  /collections/{id}/export:
    get:
      tags: [ImportExport]
      summary: Exporter une collection (JSON ou CSV)
      description: |
        Collection de l'utilisateur connecté (404 pour celle d'un autre) et tous ses items.
        CSV : `item_id`, `item_type`, `label`, puis une colonne par propriété du schéma du
        CollectionType (mêmes règles que `GET /items/export`), puis `added_at`.
      operationId: exportCollection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
        - $ref: "#/components/parameters/csvDelimiter"
        - $ref: "#/components/parameters/lang"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Fichier en pièce jointe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionExport"
            text/csv:
              schema:
                type: string
  /collections/import:
    post:
      tags: [ImportExport]
      summary: Importer une collection (JSON)
      description: |
        Importe un `CollectionExport` dans le compte de l'utilisateur connecté, en une transaction.

        - **Cible** : si `collection.id` désigne une collection de l'utilisateur, elle est mise à
          jour et devient exactement le contenu du fichier (nom, description, type, items ; les items
          absents du fichier sont **retirés**). Sinon une collection est créée (avec cet id s'il est
          libre, un nouvel id s'il appartient à quelqu'un d'autre). Un nom déjà pris par une autre
          collection de l'utilisateur reçoit un suffixe (`Mes DVD (2)`).
        - **Type** : `collection.collection_type.id`, à défaut son `name` ; inconnu → erreur de fichier.
        - **Items** : chaque `item_id` doit exister dans le catalogue (une seule fois dans le
          fichier) ; `attributes` est validé contre le schéma du CollectionType ; `added_at` est
          conservé à la création. `item_type`, `label` et `item_attributes` sont informatifs.

        Au moindre problème rien n'est appliqué (422 + rapport) ; `dry_run=true` simule.
      operationId: importCollection
      parameters:
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionExport"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Import appliqué (ou simulation sans erreur) ; `collection_id` désigne la collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "422":
          description: Erreurs de validation ; rien n'a été appliqué.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
  # ===========================================================================
  # Sources externes (connecteurs BD / Manga, romans, musique)
  # ===========================================================================
  /external/connectors:
    get:
      tags: [External]
      summary: Connecteurs disponibles
      description: |
        Tout compte connecté. Un connecteur par sorte de collection (`bd-manga`, `novels`…) et le paquet de
        domaine (`GET /domains`) qui porte les types qu'il écrit.
      operationId: listConnectors
      responses:
        "200":
          description: Connecteurs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, domain]
                  properties:
                    id: { type: string, example: bd-manga }
                    domain: { type: string, example: books }
                    editions_by_work:
                      type: boolean
                      description: Les éditions se listent depuis une œuvre (`editions?work=`).
                    edition_code:
                      type: string
                      enum: [isbn, barcode]
                      description: Code de recherche d'une édition (`editions?isbn=` ou `editions?barcode=`).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /external/{connector}/works:
    parameters:
      - $ref: "#/components/parameters/connector"
    get:
      tags: [External]
      summary: Rechercher une œuvre
      description: |
        Recherche par titre, meilleure correspondance d'abord (20 au plus) : `bd-manga` parmi les séries de
        manga, séries de bande dessinée, romans graphiques, comic strips, webtoons… (classes Wikidata) ; `novels`
        parmi les romans ; `music` parmi les groupes de parutions MusicBrainz (titre ou artiste).
      operationId: searchExternalWorks
      parameters:
        - name: q
          in: query
          required: true
          description: Titre recherché (2 à 200 caractères).
          schema: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "200":
          description: Œuvres trouvées.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExternalWorkHit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ConnectorUnavailable" }
        "502": { $ref: "#/components/responses/ExternalUnavailable" }
  /external/{connector}/editions:
    parameters:
      - $ref: "#/components/parameters/connector"
    get:
      tags: [External]
      summary: Rechercher une édition
      description: |
        Par titre (`q` : `bd-manga` index `bib.serialtitle`, `novels` index `bib.title`, 50 notices au plus,
        hors vidéos et sons), par ISBN d'un tome (`isbn`, ISBN-10 / 13 ou EAN, tirets acceptés) : l'édition
        qui contient ce tome, ou par **œuvre Wikidata** (`work`, connecteur `novels`) : les éditions de la
        notice d'œuvre BnF du roman (`P268`, index `bib.work2bib`, 150 au plus, éditions françaises
        d'abord). Connecteur `music` : par titre (index `release`), par **code-barres** (`barcode`, EAN / UPC
        avec clé de contrôle valide) ou par album (`work`, MBID du groupe de parutions : ses parutions, 100 au
        plus, les plus anciennes d'abord) ; `isbn` y est refusé, comme `barcode` pour les livres.
        Connecteur `films` : par titre (notices vidéo, `bib.doctype any "h"`), par **code-barres** (`barcode`, index
        `bib.ean`) ou par film (`work`, QID : éditions de sa notice d'œuvre BnF, les plus récentes d'abord).
        Connecteur `series` : coffrets par titre, par **code-barres** ou par série (`work`, QID : notices vidéo titrées
        comme la série, les coffrets n'ayant pas de notice d'œuvre), titre complété de la saison (200 `$h`).
        Connecteur `games` : par titre, par **code-barres** (`barcode`, `bib.ean`, aussi sans zéro initial) ou par jeu
        (`work`, QID : notices de jeu titrées comme lui), les plus récentes d'abord.
        Exactement un des paramètres ; l'identifiant `work` est vérifié par le connecteur (400).

        Connecteur `novels` : une notice sans ensemble est une édition en un volume (le livre, avec son
        ISBN) ; une notice liée (461) à un ensemble titré comme le roman représente cet ensemble ; un
        volume d'« Œuvres complètes » reste une édition en un volume.
      operationId: searchExternalEditions
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: isbn
          in: query
          schema: { type: string, example: "978-2-87695-205-8" }
        - name: barcode
          in: query
          description: Code-barres d'une parution (connecteur `music`), espaces et tirets acceptés.
          schema: { type: string, example: "634904078126" }
        - name: work
          in: query
          description: Œuvre — QID Wikidata du roman (`novels`), MBID du groupe de parutions (`music`).
          schema: { type: string, maxLength: 200, example: Q163297 }
      responses:
        "200":
          description: Éditions trouvées.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExternalEditionHit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ConnectorUnavailable" }
        "502": { $ref: "#/components/responses/ExternalUnavailable" }
  /external/{connector}/preview:
    parameters:
      - $ref: "#/components/parameters/connector"
    post:
      tags: [External]
      summary: Aperçu des items proposés
      description: |
        Récupère l'œuvre (titre, années, public, nombre de tomes VO…), son univers (`P8345`) et ses
        auteurs (`P50` auteur, `P58` scénariste, `P110` dessinateur → `roles`) sur Wikidata ; pour
        chaque édition, ses éditeurs et tous ses tomes (numéro, titre, ISBN, pages, prix en euros) à
        la BnF. Chaque nœud est rapproché du catalogue (statut `new` / `update` / `unchanged`).
        Les réimpressions (même numéro) et les tomes sans numéro ne sont pas sélectionnés par défaut.
      operationId: previewExternal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalImportRequest" }
      responses:
        "200":
          description: Items et relations proposés.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConnectorUnavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "502": { $ref: "#/components/responses/ExternalUnavailable" }
  /external/{connector}/propose:
    parameters:
      - $ref: "#/components/parameters/connector"
    post:
      tags: [External]
      summary: Proposer la sélection
      description: |
        Tout compte connecté (P4-3b). Même requête que `import` (avec `title`) : la sélection devient une
        proposition `catalog` soumise à la modération (mêmes contrôles : quota, simulation d'import, instantané
        de départ) au lieu d'être importée.
      operationId: proposeExternal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalImportRequest"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Source externe injoignable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "201":
          description: Proposition créée et soumise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /external/{connector}/import:
    parameters:
      - $ref: "#/components/parameters/connector"
    post:
      tags: [External]
      summary: Simuler ou importer la sélection
      description: |
        Reconstruit l'aperçu de la même sélection (réponses des sources gardées en cache 15 min), garde
        les nœuds de `selected` et les passe par l'import du catalogue (`POST /import`) : une transaction,
        rien n'est appliqué au moindre problème (422 + rapport), `dry_run=true` simule. Les items
        existants gardent leurs tags et leurs valeurs (seuls les champs vides sont remplis).
      operationId: importExternal
      parameters:
        - name: dry_run
          in: query
          description: Simuler l'import (rapport complet, aucune écriture).
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalImportRequest" }
      responses:
        "200":
          description: Import appliqué (ou simulation sans erreur).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalImportReport" }
        "422":
          description: Erreurs de validation ; rien n'a été appliqué.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConnectorUnavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ExternalUnavailable" }

  # ===========================================================================
  # Visibilité et partage (P4-2)
  # ===========================================================================

  /members:
    get:
      tags: [Users]
      summary: Annuaire des membres
      description: Comptes actifs dont le profil est visible des membres ou public, par nom d'utilisateur.
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Profils visibles.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, per_page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicProfile"
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /public/users/{username}:
    get:
      tags: [Public]
      summary: Profil d'un membre
      description: |
        Authentification facultative. 404 si le profil n'est pas visible du lecteur (privé, réservé aux membres
        pour un anonyme, compte désactivé). Un jeton invalide répond 401.
      operationId: getPublicProfile
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Profil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"

  /public/users/{username}/collections:
    get:
      tags: [Public]
      summary: Collections visibles d'un membre
      description: |
        Authentification facultative. Le profil doit être visible du lecteur (sinon 404) ; seules les collections
        visibles du lecteur sont listées, la plus grande en premier.
      operationId: listPublicCollections
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Collections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCollection"

  /public/users/{username}/reviews:
    get:
      tags: [Reviews]
      summary: Avis signés d'un membre
      description: |
        Authentification facultative. Le profil doit être visible du lecteur (sinon 404). Seuls les avis **signés pour
        le lecteur** sont listés : un avis anonyme ou une note seule, listés sous un nom, perdraient leur anonymat.
      operationId: listPublicReviews
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/username"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Avis, le plus récent d'abord, avec leur item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/Review"

  /public/collections/{id}:
    get:
      tags: [Public]
      summary: Collection visible
      description: |
        Authentification facultative. 404 si la collection n'est pas visible du lecteur ou si son propriétaire est
        désactivé. Pour tout autre que le propriétaire, les champs cachés sont retirés (admins compris).
      operationId: getPublicCollection
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollection"

  /public/collections/{id}/items:
    get:
      tags: [Public]
      summary: Items d'une collection visible
      description: Mêmes règles que `GET /public/collections/{id}` ; attributs cachés retirés de chaque exemplaire.
      operationId: listPublicCollectionItems
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          $ref: "#/components/responses/CollectionItemPage"

  /public/collections/{id}/stats:
    get:
      tags: [Public]
      summary: Statistiques d'une collection visible
      description: Mêmes règles ; un champ caché n'entre dans aucun agrégat.
      operationId: getPublicCollectionStats
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Statistiques.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionStats"

  /share:
    get:
      tags: [Public]
      summary: Collection partagée par lien
      description: |
        Anonyme, lecture seule. Le lien vaut quelle que soit la visibilité de la collection, jusqu'à sa
        révocation (404 ensuite). Champs cachés retirés. Le jeton passe en paramètre de requête.
      operationId: getSharedCollection
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/shareToken"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollection"

  /share/items:
    get:
      tags: [Public]
      summary: Items d'une collection partagée
      operationId: listSharedCollectionItems
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/shareToken"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          $ref: "#/components/responses/CollectionItemPage"

  /share/stats:
    get:
      tags: [Public]
      summary: Statistiques d'une collection partagée
      operationId: getSharedCollectionStats
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/shareToken"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Statistiques.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionStats"

  /collections/{id}/share-links:
    get:
      tags: [Collections]
      summary: Liens de partage actifs d'une collection
      description: Collection de l'utilisateur connecté (404 pour celle d'un autre).
      operationId: listShareLinks
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Liens actifs, le plus récent en premier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"
    post:
      tags: [Collections]
      summary: Créer un lien de partage
      operationId: createShareLink
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Lien créé ; le jeton n'est montré qu'ici.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkCreated"

  /collections/{id}/share-links/{linkId}:
    delete:
      tags: [Collections]
      summary: Révoquer un lien de partage
      operationId: revokeShareLink
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - name: linkId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Lien révoqué.

  # ===========================================================================
  # Historique du catalogue (P4-3a)
  # ===========================================================================

  /items/{id}/history:
    get:
      tags: [Items]
      summary: Historique d'un item
      description: Écritures de l'item et des relations dont il est la source ou la cible, avec leur auteur et leur origine.
      operationId: getItemHistory
      parameters:
        - $ref: "#/components/parameters/collectionId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Historique.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemHistory"

  /items/{id}/revert:
    post:
      tags: [Items]
      summary: Revenir à une version
      description: |
        **Admin ou contributeur.** Restaure les attributs d'une version (validés contre le schéma actuel du type, 422
        sinon) ; l'écriture est historisée avec l'origine `revert`. 400 pour une version de suppression.
      operationId: revertItem
      parameters:
        - $ref: "#/components/parameters/collectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequest"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Item restauré.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  # ===========================================================================
  # Propositions et modération (P4-3b)
  # ===========================================================================

  /items/duplicates:
    post:
      tags: [Items]
      summary: Chercher des doublons
      description: Items du même type qui portent déjà une valeur d'un champ `x-identifier` (ISBN, EAN, QID…) de `attributes`.
      operationId: findDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateCheck"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Doublons (vide s'il n'y en a pas).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Duplicate"

  /proposals:
    get:
      tags: [Proposals]
      summary: Lister des propositions
      description: |
        `scope=mine` (défaut) : les miennes, brouillons compris. `scope=review` (admins, contributeurs) : les
        propositions soumises des autres (jamais les brouillons), les plus anciennes en attente d'abord.
      operationId: listProposals
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, review], default: mine }
        - name: status
          in: query
          schema: { type: string, enum: [draft, pending, changes_requested, accepted, rejected, withdrawn] }
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Propositions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/Proposal"
    post:
      tags: [Proposals]
      summary: Créer une proposition
      description: |
        Brouillon, ou soumise si `submit`. Une charge `catalog` ne contient que des items et des relations
        (422 `proposal_meta_types` sinon) ; elle est vérifiée par une simulation d'import à la soumission
        (422 `proposal_invalid` avec le rapport). Quota de propositions en attente (409 `proposal_quota`).
      operationId: createProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Proposition créée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /proposals/quota:
    get:
      tags: [Proposals]
      summary: Mon quota de propositions
      description: |
        Propositions en attente (en attente ou à corriger) et limite : `PROPOSAL_QUOTA` + 1 par proposition
        acceptée, plafonnée ; créations des dernières 24 h et leur limite. `unlimited` pour un admin ou un
        contributeur (aucun quota).
      operationId: getProposalQuota
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalQuota"

  /proposals/review-count:
    get:
      tags: [Proposals]
      summary: Nombre de propositions à relire
      description: Admins et contributeurs (pastille) ; propositions des autres en attente.
      operationId: countProposalsToReview
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Nombre.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }

  /proposals/{id}:
    get:
      tags: [Proposals]
      summary: Lire une proposition
