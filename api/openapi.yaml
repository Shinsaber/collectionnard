  # ===========================================================================
  # Notifications (P4-3c)
  # ===========================================================================

  /items/{id}/recommendations:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    post:
      tags: [Recommendations]
      summary: Recommander un item à un membre
      description: |
        Le destinataire, un membre de l'annuaire, est notifié (`recommendation`). Une seule recommandation par
        expéditeur, destinataire et item tant qu'elle n'est pas écartée. 20 par jour et par compte.
      operationId: createRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationCreate"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`recommendations_refused` : le membre refuse les recommandations, ou a bloqué l'expéditeur."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item inconnu, ou destinataire inconnu ou hors de l'annuaire.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`already_recommended` : déjà recommandé à ce membre."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: "`rate_limited` (`Retry-After`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Recommandation envoyée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /me/recommendations:
    get:
      tags: [Recommendations]
      summary: Mes recommandations reçues
      description: Les plus récentes d'abord ; `unread` compte toutes les non-lues.
      operationId: listMyRecommendations
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Recommandations reçues.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, per_page, unread]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recommendation"
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
                  unread: { type: integer }

  /me/recommendations/read:
    post:
      tags: [Recommendations]
      summary: Marquer des recommandations comme lues
      description: "`ids` absent ou vide : toutes mes recommandations."
      operationId: markRecommendationsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Marquées comme lues.

  /me/recommendations/{id}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    delete:
      tags: [Recommendations]
      summary: Écarter une recommandation reçue
      operationId: deleteMyRecommendation
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
