  # ===========================================================================
  # Items
  # ===========================================================================
  /items:
    get:
      tags: [Items]
      summary: Lister / rechercher des items
      description: |
        Retourne une liste paginée d'items du catalogue.

        **Recherche plein texte** (`search`) : porte sur toutes les chaînes et tous les nombres des
        attributs (objets i18n-text compris, toutes langues), hors URLs d'images. Chaque mot est
        cherché en préfixe (`break` trouve « Breaking »), tous les mots sont requis, casse et
        accents sont ignorés (`integrale` trouve « Intégrale »). La ponctuation sépare les mots.
        Index : colonne générée `search_tsv` + GIN (migration 003).

        **Filtres par attribut** (`attr.<clé>[.<opérateur>]`) — exigent `item_type_id` : la clé doit
        exister dans le JSON Schema du type et l'opérateur convenir à son type, sinon 400.

        | Type de la propriété                  | Paramètres acceptés                                        |
        | ------------------------------------- | ---------------------------------------------------------- |
        | `string` (avec ou sans `enum`)        | `attr.k=v` (égalité), `attr.k.contains=v` (sous-chaîne)    |
        | `string` `format: date` / `date-time` | `attr.k=v`, `attr.k.gte=v`, `attr.k.lte=v` (ISO 8601)      |
        | `integer`, `number`                   | `attr.k=v`, `attr.k.gte=v`, `attr.k.lte=v`                 |
        | `boolean`                             | `attr.k=true` / `attr.k=false`                             |
        | `array` de scalaires                  | `attr.k=v` : le tableau contient `v`                       |
        | `object` `x-widget: i18n-text`        | `attr.k.contains=v` : dans l'une quelconque des langues    |

        Une égalité répétée vaut OU (`attr.type=tv&attr.type=cable`) ; les filtres se combinent en ET.
        `contains` ignore casse et accents et prend la valeur littéralement (`%`, `_` ne sont pas des
        jokers). Une valeur vide est ignorée. Au plus 20 valeurs de filtre, 200 caractères chacune.
        L'égalité utilise l'index GIN sur `attributes` (`@>`).

        **Relations** : `related_to=<uuid>` ne garde que les items liés à cet item (dans un sens ou
        l'autre), éventuellement via `relation_type_id` seulement.

        **Tri** (`sort`, préfixe `-` pour descendant) : `created_at`, `updated_at`, `relevance`
        (pertinence de `search`), ou `attr.<clé>` (exige `item_type_id` ; propriétés scalaires
        uniquement, ordre numérique pour `integer` / `number`, valeurs absentes en dernier).
        Défaut : `-relevance` si `search` est fourni, sinon `-created_at`.
      operationId: listItems
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: sort
          in: query
          description: |
            `created_at`, `updated_at`, `relevance` ou `attr.<clé>`, préfixe `-` pour descendant.
            Toute autre valeur renvoie 400.
          schema:
            type: string
          examples:
            recent: { value: "-created_at" }
            byYear: { value: "-attr.start_year" }
        - name: item_type_id
          in: query
          description: Filtrer par type d'item (UUID du ItemType). Requis par `attr.*` et `sort=attr.*`.
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: |
            Recherche plein texte dans les attributs (préfixes, tous les mots requis, sans casse ni
            accents). Exemple : `search=breaking ba` trouve « Breaking Bad ». 200 caractères au plus.
          schema:
            type: string
            maxLength: 200
        - name: tag
          in: query
          description: Filtrer par tag (nom exact, insensible à la casse).
          schema:
            type: string
            maxLength: 200
        - name: related_to
          in: query
          description: Ne garder que les items liés à cet item (source ou cible d'une relation).
          schema:
            type: string
            format: uuid
        - name: relation_type_id
          in: query
          description: Avec `related_to`, ne considérer que les relations de ce type (400 sans `related_to`).
          schema:
            type: string
            format: uuid
        - name: attr
          in: query
          description: |
            Filtres par attribut, un paramètre par condition : `attr.<clé>` (égalité, répétable = OU),
            `attr.<clé>.gte`, `attr.<clé>.lte`, `attr.<clé>.contains`. Voir la description de
            l'opération pour les opérateurs acceptés selon le type de la propriété.
            Exemple : `attr.start_year.gte=2008&attr.type=tv&attr.type=cable`.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
            example:
              attr.start_year.gte: "2008"
              attr.title.contains: "bad"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Liste paginée d'items. Chaque item inclut son ItemType et ses tags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/Item"

    post:
      tags: [Items]
      summary: Créer un item
      description: |
        **Admin ou contributeur.**

        Crée un nouvel item dans le catalogue. Les attributs sont **validés contre le
        JSON Schema** du ItemType référencé. En cas de non-conformité, une erreur 422
        est retournée avec le détail par champ.

        Les tags sont créés automatiquement s'ils n'existent pas encore.
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
            example:
              item_type_id: b0000000-0000-0000-0000-000000000001
              attributes:
                title: Breaking Bad
                synopsis: Un professeur de chimie se tourne vers la fabrication de méthamphétamine.
                start_year: 2008
                end_year: 2013
              tags: [drame, thriller, crime]
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Item créé avec succès. Retourne l'item complet avec son type et ses tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de l'item.
        schema:
          type: string
          format: uuid
    get:
      tags: [Items]
      summary: Détail d'un item
      description: |
        Retourne un item avec son ItemType complet et ses tags.
        Utile pour afficher la fiche détaillée d'un item.
      operationId: getItem
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Item trouvé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Items]
      summary: Modifier un item
      description: |
        **Admin ou contributeur.**

        Modifie les attributs et/ou tags d'un item. Les attributs sont **revalidés**
        contre le JSON Schema du ItemType.

        Le `item_type_id` ne peut pas être changé (il faudrait supprimer et recréer).
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Item modifié avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Items]
      summary: Supprimer un item
      description: |
        **Admin uniquement.**

        Supprime un item du catalogue. **Effet en cascade** :
        - Toutes les relations (ItemRelation) impliquant cet item sont supprimées
        - Tous les liens avec les collections (CollectionItem) sont supprimés
        - Les tags orphelins ne sont pas supprimés automatiquement
      operationId: deleteItem
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Item et dépendances supprimés.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Item Collections (membership)
  # ===========================================================================
  /items/{id}/collections:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de l'item dont on veut connaître les collections.
        schema:
          type: string
          format: uuid
    get:
      tags: [Items, Collections]
      summary: Collections contenant cet item
      description: |
        Retourne la liste des collections de l'utilisateur authentifié qui contiennent
        cet item, avec les **attributs contextuels** (état, prix, note…) de chaque
        appartenance.

        Utile pour afficher sur la fiche d'un item dans quelles collections l'utilisateur
        l'a déjà ajouté, et avec quels attributs.
      operationId: listItemCollections
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Liste des collections contenant cet item pour l'utilisateur courant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemCollectionMembership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{id}/relations/collections:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de l'item dont on affiche les relations.
        schema:
          type: string
          format: uuid
    get:
      tags: [Items, Collections]
      summary: Items liés présents dans mes collections
      description: |
        Pour chaque item lié à cet item (dans un sens ou dans l'autre) et présent dans au moins une
        collection de l'utilisateur authentifié : ces collections. Les items liés absents de ses
        collections ne figurent pas dans la réponse. Sert d'indicateur dans la liste des relations
        de la fiche d'un item ; une requête indexée (`collection_items.item_id`).
      operationId: listRelatedItemCollections
      responses:
        "200":
          description: Items liés présents dans les collections de l'utilisateur.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedItemCollections"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ===========================================================================
  # Item Relations
  # ===========================================================================
  /items/{id}/relations:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de l'item dont on veut les relations (sortantes et entrantes).
        schema:
          type: string
          format: uuid
    get:
      tags: [Items, Relations]
      summary: Relations d'un item (sortantes et entrantes)
      description: |
        Retourne les relations impliquant cet item, qu'il soit **source** (sortantes)
        ou **cible** (entrantes), **paginées** (100 par page par défaut, 100 au plus) et triées par
        nom du type de relation, puis par l'attribut `order`, puis par date de création.

        Chaque relation inclut ses deux extrémités (`source_item`, `target_item`) avec leurs
        attributs, mais **ni** `relation_type` **ni** `item_type` : leurs schémas se répétaient à
        chaque ligne. Le client les retrouve par `relation_type_id` et `item_type_id` dans
        `GET /relation-types` et `GET /item-types` (mis en cache côté front).

        Le client peut déterminer la direction en comparant `source_item_id` avec l'ID de l'item :
        - `source_item_id == id` → relation sortante
        - `target_item_id == id` → relation entrante

        Filtrable par type de relation pour ne voir que certains liens.
      operationId: listItemRelations
      parameters:
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          description: Relations par page (défaut **100** sur cette route, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: relation_type_id
          in: query
          description: |
            Filtrer par type de relation (UUID du RelationType).
            Exemple : ne voir que les relations "contains_episode".
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Page de relations (sortantes et entrantes), sans les méta-types joints.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemRelation"
        "404":
          $ref: "#/components/responses/NotFound"

  /relations:
    post:
      tags: [Relations]
      summary: Créer une relation entre deux items
      description: |
        **Admin ou contributeur.**

        Crée une relation (arête orientée) entre deux items existants.

        **Validations effectuées automatiquement :**
        1. Les deux items (`source_item_id`, `target_item_id`) doivent exister
        2. Le ItemType de la source doit être l'un des `source_item_type_ids` du RelationType
        3. Le ItemType de la cible doit être l'un des `target_item_type_ids` du RelationType
        4. Les `attributes` doivent respecter le JSON Schema du RelationType
        5. Le triplet (relation_type, source, target) doit être unique → 409 si doublon
        6. `source_item_id` ≠ `target_item_id` (pas d'auto-référence) → 422 sinon
      operationId: createRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRelationCreate"
            example:
              relation_type_id: c0000000-0000-0000-0000-000000000005
              source_item_id: e0000000-0000-0000-0000-000000000020
              target_item_id: e0000000-0000-0000-0000-000000000010
              attributes:
                disc: 1
                track: 1
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Relation créée avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRelation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /relations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de la relation.
        schema:
          type: string
          format: uuid
    get:
      tags: [Relations]
      summary: Détail d'une relation
      description: |
        Retourne une relation avec son RelationType, l'item source et l'item cible.
      operationId: getRelation
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Relation trouvée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRelation"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Relations]
      summary: Modifier les attributs d'une relation
      description: |
        **Admin ou contributeur.**

        Modifie les attributs d'une relation existante. Les items source et target
        **ne peuvent pas être changés** — pour cela, supprimer et recréer la relation.

        Les attributs sont revalidés contre le JSON Schema du RelationType.
      operationId: updateRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRelationUpdate"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Relation modifiée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRelation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Relations]
      summary: Supprimer une relation
      description: |
        **Admin ou contributeur.** Supprime la relation. Les items source et cible
        ne sont pas affectés.
      operationId: deleteRelation
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Relation supprimée.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Graph
  # ===========================================================================
  /items/{id}/graph:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de l'item racine pour la traversée.
        schema:
          type: string
          format: uuid
    get:
      tags: [Graph]
      summary: Sous-graphe à partir d'un item
      description: |
        Effectue une **traversée récursive bidirectionnelle** du graphe depuis un item racine.
        Le graphe est exploré dans les **deux sens** :
        - **Descendant** (source → target) : profondeur positive (1, 2, 3…)
        - **Ascendant** (target → source) : profondeur négative (-1, -2, -3…)

        Le nœud racine a une profondeur de 0. Le paramètre `max_depth` s'applique
        dans les deux directions.

        **Protection contre les cycles** : le serveur détecte les cycles et ne
        visite jamais un nœud deux fois dans un même chemin.

        **Filtrage** : utilisez `relation_type_ids` pour limiter la traversée
        à certains types de relation (ex: ne suivre que "contains_episode").

        Le format de réponse sépare le nœud racine des autres nœuds pour
        faciliter le rendu (la racine a souvent un style différent).
      operationId: getItemGraph
      parameters:
        - name: max_depth
          in: query
          description: |
            Profondeur maximale de traversée depuis la racine, dans chaque direction.
            - `1` : uniquement les voisins directs (depth -1 et +1)
            - `3` (défaut) : 3 niveaux dans chaque direction
            - `5` : maximum pour un utilisateur ; `10` pour un admin

            La traversée est un parcours en largeur, niveau par niveau : `max_depth` niveaux en
            descendant (profondeur positive) puis en remontant (profondeur négative), chaque nœud
            n'étant visité qu'une fois. Elle s'arrête aussi à `GRAPH_MAX_NODES` nœuds (`truncated`)
            et après 5 s (503). Une valeur hors bornes ou non entière renvoie 400.
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 10
        - name: relation_type_ids
          in: query
          description: |
            Filtrer la traversée par types de relation. Format : liste d'UUIDs séparés par des virgules
            (20 maximum ; un UUID invalide renvoie 400). Seules les arêtes de ces types seront suivies.
            Si omis, toutes les relations sont suivies.

            Exemple : `relation_type_ids=c0000000-...-001,c0000000-...-003`
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "400":
          description: "`max_depth` hors bornes ou `relation_type_ids` invalide / trop long."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Exploration interrompue après 5 s (réduire `max_depth` ou filtrer).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: |
            Sous-graphe retourné avec succès. Contient :
            - `root` : le nœud racine
            - `nodes` : les autres nœuds découverts
            - `edges` : les arêtes entre les nœuds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
              example:
                root:
                  id: e0000000-0000-0000-0000-000000000001
                  type: Series
                  label: Breaking Bad
                  attributes:
                    { title: Breaking Bad, start_year: 2008, end_year: 2013 }
                  depth: 0
                nodes:
                  - id: e0000000-0000-0000-0000-000000000050
                    type: Personne
                    label: Vince Gilligan
                    attributes: { name: Vince Gilligan, role: creator }
                    depth: -1
                  - id: e0000000-0000-0000-0000-000000000002
                    type: Broadcast
                    label: AMC 2008-2013
                    attributes:
                      { name: AMC 2008-2013, type: cable, channel: AMC }
                    depth: 1
                  - id: e0000000-0000-0000-0000-000000000003
                    type: Season
                    label: S1
                    attributes: { name: Saison 1, number: 1, year: 2008 }
                    depth: 2
                  - id: e0000000-0000-0000-0000-000000000010
                    type: Episode
                    label: Pilot
                    attributes: { number: 1, title: Pilot, duration: 58 }
                    depth: 3
                edges:
                  - source_id: e0000000-0000-0000-0000-000000000050
                    target_id: e0000000-0000-0000-0000-000000000001
                    relation_type: cree_par
                    attributes: {}
                  - source_id: e0000000-0000-0000-0000-000000000001
                    target_id: e0000000-0000-0000-0000-000000000002
                    relation_type: broadcast_on
                    attributes: { broadcast_start_year: 2008 }
                  - source_id: e0000000-0000-0000-0000-000000000002
                    target_id: e0000000-0000-0000-0000-000000000003
                    relation_type: contains_season
                    attributes: {}
                  - source_id: e0000000-0000-0000-0000-000000000003
                    target_id: e0000000-0000-0000-0000-000000000010
                    relation_type: contains_episode
                    attributes: { order: 1 }
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Collections (user)
  # ===========================================================================
  /collections:
    get:
      tags: [Collections]
      summary: Lister les collections de l'utilisateur courant
      description: |
        Retourne les collections de l'utilisateur authentifié, avec le nombre
        d'items dans chaque collection. Filtrable par type de collection.
      operationId: listCollections
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: collection_type_id
          in: query
          description: 'Filtrer par type de collection (ex: uniquement les collections "Ownership").'
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Collections de l'utilisateur.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/Collection"

    post:
      tags: [Collections]
      summary: Créer une collection
      description: |
        Crée une nouvelle collection pour l'utilisateur authentifié.
        Le nom doit être unique parmi les collections de cet utilisateur.
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
            example:
              collection_type_id: d0000000-0000-0000-0000-000000000001
              name: Mes DVDs
              description: Ma collection de DVDs et Blu-rays
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`collection_type_id` inconnu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Données invalides (`validation_error`), type d'item que le CollectionType ne permet pas
            (`item_type_not_allowed`) ou tri par défaut impossible (`invalid_sort`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Collection créée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "409":
          description: Une collection avec ce nom existe déjà pour cet utilisateur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de la collection.
        schema:
          type: string
          format: uuid
    get:
      tags: [Collections]
      summary: Détail d'une collection
      description: |
        Retourne la collection avec son CollectionType et le nombre d'items.
        L'utilisateur ne peut accéder qu'à ses propres collections.
      operationId: getCollection
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Collection trouvée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Collections]
      summary: Modifier une collection
      description: |
        Modifie le nom et/ou la description de la collection.
        Le **CollectionType ne peut pas être changé** après création.
      operationId: updateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Collection modifiée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Une autre collection avec ce nom existe déjà.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Champs cachés inconnus (`validation_error`), type d'item que le CollectionType ne permet pas
            (`item_type_not_allowed`) ou tri par défaut impossible (`invalid_sort`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Collections]
      summary: Supprimer une collection
      description: |
        Supprime la collection et tous les liens CollectionItem associés.
        **Les items du catalogue ne sont pas supprimés** — seuls les liens
        personnels (état, prix, note…) sont perdus.
      operationId: deleteCollection
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Collection et liens supprimés.
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Collection Items (user)
  # ===========================================================================
  /collections/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID de la collection.
        schema:
          type: string
          format: uuid
    get:
      tags: [Collections]
      summary: Lister les items d'une collection
      description: |
        Retourne les items d'une collection avec leurs **attributs contextuels**
        (état, prix, note…) et les détails de chaque item (type, attributs métier, tags).

        Une ligne par **lot** (P7-1). Filtres : type d'item, recherche plein texte dans les attributs de l'item, lots de
        plusieurs exemplaires (`multiple`), et, avec `item_type_id`, filtres par attribut de l'item (`attr.<clé>[.<op>]`,
        mêmes règles que `GET /items`). À valeur de tri égale, les lots d'un même item se suivent.
      operationId: listCollectionItems
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: sort
          in: query
          description: |
            `created_at` (date d'ajout du lot, défaut `-created_at`), `updated_at`, `quantity`, `relevance` (pertinence de
            `search`) ou `attr.<clé>` (attribut de l'item, exige `item_type_id`, sauf pour une collection spécialisée) ;
            préfixe `-` pour descendant. Absent : le `default_sort` de la collection.
          schema:
            type: string
          examples:
            largestLots: { value: "-quantity" }
            byNumber: { value: "attr.number" }
        - name: item_type_id
          in: query
          description: Filtrer par type d'item dans la collection. Requis par `attr.*` et `sort=attr.*`.
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Recherche plein texte dans les attributs de l'item (comme `GET /items`), 200 caractères au plus.
          schema:
            type: string
        - name: multiple
          in: query
          description: "`true` : seulement les lots de plusieurs exemplaires (doubles à échanger…)."
          schema:
            type: boolean
        - name: attr
          in: query
          description: |
            Filtres par attribut de l'item, un paramètre par condition (voir `GET /items`). Exigent `item_type_id`.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Items de la collection avec attributs contextuels.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/CollectionItem"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Collections]
      summary: Ajouter un item à la collection
      description: |
        Ajoute un item existant du catalogue à cette collection, avec des
        **attributs contextuels** (état, prix, note…) validés contre le
        JSON Schema du CollectionType.

        Crée toujours un nouveau lot (`quantity`, 1 par défaut), même si l'item est déjà dans la collection :
        le client propose alors d'augmenter un lot existant ou d'en créer un (P7-1).
      operationId: addItemToCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionItemAdd"
            example:
              item_id: e0000000-0000-0000-0000-000000000020
              attributes:
                condition: new
                purchase_price: 45.00
                acquisition_date: "2020-12-25"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Item ajouté à la collection avec ses attributs contextuels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionItem"
        "404":
          description: Collection ou item non trouvé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Attributs invalides (`validation_error`), ou type d'item non permis par le
            CollectionType (`item_type_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /collections/{collectionId}/lots/{lotId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: UUID de la collection.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/lotId"
    put:
      tags: [Collections]
      summary: Modifier un lot de la collection
      description: |
        Met à jour les attributs contextuels (état, prix, note…) d'un lot et, si elle est donnée, sa
        quantité. Les attributs sont revalidés contre le JSON Schema du CollectionType.

        Ne modifie **pas** les attributs de l'item du catalogue (title, année…),
        uniquement les données personnelles de l'utilisateur.
      operationId: updateCollectionItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionItemUpdate"
            example:
              attributes:
                condition: bon
                purchase_price: 45.00
                acquisition_date: "2020-12-25"
              quantity: 2
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Attributs contextuels modifiés.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Collections]
      summary: Retirer un lot de la collection
      description: |
        Retire le lot (tous ses exemplaires) de cette collection. **L'item n'est pas
        supprimé du catalogue** — il reste disponible pour d'autres collections
        et d'autres utilisateurs. Seules les données contextuelles (état, prix, note…)
        sont perdues.
      operationId: removeItemFromCollection
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Lot retiré de la collection.
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{collectionId}/lots/{lotId}/split:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: UUID de la collection.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/lotId"
    post:
      tags: [Collections]
      summary: Scinder un lot
      description: |
        Détache `quantity` exemplaires du lot vers un nouveau lot du même item (une carte abîmée sort d'un lot
        de 5). Le nouveau lot prend `attributes`, ou à défaut une copie des attributs du lot d'origine.
      operationId: splitCollectionLot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionLotSplit"
            example:
              quantity: 1
              attributes:
                condition: damaged
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Nouveau lot ; le lot d'origine a perdu `quantity` exemplaires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            Attributs invalides (`validation_error`), ou quantité hors bornes (`invalid_quantity` : il doit rester
            au moins un exemplaire dans le lot d'origine).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /collections/{collectionId}/lots/{lotId}/merge:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: UUID de la collection.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/lotId"
    post:
      tags: [Collections]
      summary: Fusionner un lot dans un autre
      description: |
        Ajoute les exemplaires du lot à `into` (même item, même collection), qui garde ses attributs, puis
        supprime le lot. Les photos de ses galeries (propriétés `x-widget: image-gallery` du CollectionType, photos
        d'exemplaire) rejoignent celles de `into`, catégorie par catégorie, sans doublon ; ses autres attributs sont perdus.
      operationId: mergeCollectionLot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionLotMerge"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Lot `into`, avec la quantité cumulée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            `lots_not_mergeable` : `into` est le lot lui-même ou un lot d'un autre item ; `invalid_quantity` : la
            quantité cumulée dépasse 100000.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /collections/{collectionId}/lots/{lotId}/loans:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/lotId"
    get:
      tags: [Loans]
      summary: Prêts d'un lot
      description: En cours d'abord, puis l'historique (rendus), du plus récent au plus ancien. Propriétaire seulement.
      operationId: listLotLoans
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Prêts du lot.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      tags: [Loans]
      summary: Prêter des exemplaires d'un lot
      description: L'ami emprunteur est notifié (`loan_started`).
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanCreate"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: |
            `not_lendable` : le type de la collection n'ouvre pas les prêts ; `borrower_not_friend` : l'emprunteur
            nommé n'est pas un ami (compte inconnu compris) ; `loan_exceeds_lot` : plus assez d'exemplaires non prêtés ;
            `invalid_quantity`, `validation_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Prêt créé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /loans/{id}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    put:
      tags: [Loans]
      summary: Modifier ou clore un prêt
      description: Échéance, rendu le, quantité, note. Une nouvelle échéance permet un nouveau rappel. Propriétaire seulement.
      operationId: updateLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanUpdate"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: "`loan_exceeds_lot`, `invalid_quantity`, `validation_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Prêt modifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
    delete:
      tags: [Loans]
      summary: Supprimer un prêt
      description: Un prêt saisi par erreur ; un prêt rendu se garde comme historique.
      operationId: deleteLoan
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
