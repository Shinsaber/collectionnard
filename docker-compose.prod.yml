# Production : images publiées par la CI sur GitHub Container Registry (pas de build local).
# Variables : copier .env.example en .env (JWT_SECRET et POSTGRES_PASSWORD obligatoires).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm server colec-server create-user <nom> <email> --admin
#   docker compose -f docker-compose.prod.yml run --rm server colec-server install-domain --all
#
# Pas de jeu de démonstration : la base démarre vide ; le premier compte se crée avec create-user, les
# types (séries TV, livres…) s'installent avec install-domain ou la page Administration → Domaines.
# Seul le service web est publié (WEB_PORT, 3000 par défaut, en HTTP) : placer devant un reverse-proxy
# HTTPS (Caddy, Traefik, nginx…), indispensable à l'application installable et au mode hors ligne.
services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: colec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env (voir .env.example)}
      POSTGRES_DB: colec
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colec -d colec"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applique les migrations puis se termine (jamais de seed en production).
  migrate:
    image: ghcr.io/shinsaber/collectionnard-server:${COLEC_VERSION:-latest}
    command: ["colec-server", "migrate"]
    environment:
      DATABASE_URL: "postgres://colec:${POSTGRES_PASSWORD}@postgres:5432/colec?sslmode=disable"
      SEED_ON_EMPTY: "false"
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: ghcr.io/shinsaber/collectionnard-server:${COLEC_VERSION:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://colec:${POSTGRES_PASSWORD}@postgres:5432/colec?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET (32 caractères minimum) dans .env (voir .env.example)}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      TRUSTED_PROXY: "true" # X-Real-IP posé par nginx (service web) ; l'API n'est pas publiée directement
      UPLOAD_DIR: "/data/uploads"
      MAX_UPLOAD_SIZE: "10485760"
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-60}
      UPLOAD_RATE_BYTES: ${UPLOAD_RATE_BYTES:-314572800}
      UPLOAD_PURGE_INTERVAL: ${UPLOAD_PURGE_INTERVAL:-24h}
      MAX_IMPORT_SIZE: "20971520" # couvert par nginx (location = /api/v1/import)
      EXTERNAL_USER_AGENT: ${EXTERNAL_USER_AGENT:-}
      MEMBER_INVITES: ${MEMBER_INVITES:-false}
      PROPOSAL_QUOTA: ${PROPOSAL_QUOTA:-5}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/shinsaber/collectionnard-web:${COLEC_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      # Adresse ou réseau du reverse-proxy TLS placé devant (web/nginx-real-ip.conf.template) ;
      # 127.0.0.1 : aucun X-Forwarded-For relu.
      REAL_IP_FROM: ${REAL_IP_FROM:-127.0.0.1}
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
